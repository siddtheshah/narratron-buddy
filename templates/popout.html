<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narratron - Pop-out Chat</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/chat.css">
    <style>
        :root {
            --bg-color: #0f1115;
            --text-color: #ffffff;
            --accent-color: #6366f1;
            --glass-bg: rgba(15, 17, 21, 0.85);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        header {
            padding: 0.8rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h2 {
            margin: 0;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, #a5b4fc);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            color: #a5b4fc;
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .tab-bar {
            display: flex;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.3);
        }

        .tab-btn {
            flex: 1;
            padding: 0.6rem 0.5rem;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: #94a3b8;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .tab-btn.active {
            color: #a5b4fc;
            border-bottom-color: var(--accent-color);
            background: rgba(99, 102, 241, 0.1);
        }

        .tab-content {
            flex: 1;
            display: none;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .tab-content.active {
            display: flex;
        }

        /* Chat Tab */
        #chat-messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.28) transparent;
        }

        #chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        #chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        #chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.28);
            border-radius: 10px;
        }

        #chat-messages::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.55);
        }

        .agent-thought-card {
            margin: 0.7rem 0.8rem 0;
            padding: 0.65rem 0.75rem;
            border: 1px solid rgba(168, 85, 247, 0.38);
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(88, 28, 135, 0.34), rgba(30, 41, 59, 0.7));
        }

        .agent-thought-card.is-highlighted {
            border-color: #fbbf24;
            background: linear-gradient(135deg, rgba(180, 83, 9, 0.65), rgba(92, 50, 16, 0.85));
            box-shadow: 0 0 18px rgba(245, 158, 11, 0.55);
        }

        .agent-thought-label {
            margin-bottom: 0.3rem;
            color: #e9d5ff;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .agent-thought-text {
            color: #e2e8f0;
            font-size: 0.82rem;
            line-height: 1.35;
            white-space: pre-wrap;
            word-break: break-word;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 4;
            overflow: hidden;
        }

        .agent-thought-text.is-wandering {
            font-style: italic;
        }

        .chat-message {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.75rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
            line-height: 1.4;
            color: #cbd5e1;
            word-wrap: break-word;
            flex-shrink: 0;
        }

        #chat-form {
            display: flex;
            padding: 0.8rem;
            border-top: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
            gap: 0.5rem;
        }

        #chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 0.5rem 1rem;
            color: #fff;
            font-family: inherit;
            outline: none;
            font-size: 0.9rem;
        }

        #chat-input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent-color);
        }

        #chat-form button {
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 20px;
            padding: 0.5rem 1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        /* Controls Tab */
        .controls-container {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            overflow-y: auto;
            flex: 1;
        }

        .card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1rem;
        }

        .card h3 {
            margin: 0 0 0.5rem 0;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a5b4fc;
        }

        .card p {
            margin: 0;
            font-size: 0.9rem;
            color: #e2e8f0;
            line-height: 1.4;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }
    </style>
</head>

<body>

    <header>
        <h2>Narratron Pop-out Chat</h2>
        <div class="header-actions">
            <button class="icon-btn" id="dock-back-btn" title="Dock back to main canvas">
                📥 Dock Back
            </button>
        </div>
    </header>

    <div class="tab-bar">
        <button class="tab-btn active" data-tab="chat-tab">💬 Live Chat</button>
        <button class="tab-btn" data-tab="controls-tab">🎛️ Theater Info</button>
    </div>

    <div id="chat-tab" class="tab-content active">
        <div id="chat-user-bar"
            style="padding: 0.5rem 0.8rem; border-bottom: 1px solid var(--glass-border); background: rgba(0, 0, 0, 0.15); display: flex; align-items: center; gap: 8px; font-size: 0.8rem;">
            <span style="color: #94a3b8; font-weight: 500; white-space: nowrap;">Name:</span>
            <input type="text" id="chat-name-input"
                style="flex: 1; min-width: 0; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 3px 10px; color: #fff; font-size: 0.8rem; outline: none; font-family: inherit;"
                placeholder="Your Chat Name..." title="Click to set/change your chat display name">
            <span id="chat-name-badge"
                style="font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; background: rgba(99, 102, 241, 0.2); color: #a5b4fc; font-weight: 600; flex-shrink: 0;">Anon</span>
        </div>
        <div class="agent-thought-card" aria-live="polite">
            <div class="agent-thought-label">📌 Narratron's current thought</div>
            <div id="agent-thought-text" class="agent-thought-text">Waiting for Narratron to think…</div>
        </div>
        <div id="chat-messages"></div>
        <form id="chat-form">
            <textarea id="chat-input" rows="2" wrap="soft" aria-label="Chat message" placeholder="Type an idea..." autocomplete="off" required></textarea>
            <div class="chat-composer-actions">
                <div class="chat-emotes-control">
                    <button type="button" data-chat-emotes-toggle aria-label="Emotes" aria-expanded="false" aria-controls="chat-emotes-palette" title="Add an emote"><span aria-hidden="true">😀</span></button>
                    <div id="chat-emotes-palette" class="chat-emotes-palette" role="group" aria-label="Emotes palette" hidden></div>
                </div>
                <button type="submit" data-chat-command="suggest" aria-label="Send suggestion" aria-keyshortcuts="Control+Enter" title="Send as a suggestion (Ctrl+Enter)"><span aria-hidden="true">💡</span></button>
                <button type="submit" aria-label="Send" title="Send message (Enter)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <path d="m22 2-7 20-4-9-9-4Z"></path>
                        <path d="M22 2 11 13"></path>
                    </svg>
                </button>
            </div>
        </form>
    </div>

    <div id="controls-tab" class="tab-content">
        <div class="controls-container">
            <div class="card">
                <h3>Current Scene Prompt</h3>
                <p id="popout-prompt-text">No prompt available yet.</p>
            </div>
            <div class="card">
                <h3>Music & Audio</h3>
                <p id="popout-music-status">🎵 Silent</p>
            </div>
            <div class="card">
                <h3>Theater Details</h3>
                <p>Status: <span class="status-badge">Active</span></p>
                <p style="margin-top: 6px; font-size: 0.8rem; color: #94a3b8;" id="popout-narratron-theater-id">Theater:
                    Loading...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initPopoutChat } from "/static/generated/pages/popout.js";
        initPopoutChat();
    </script>
</body>

</html>
