<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><!-- POLICY_TITLE --> · Narratron</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/auth-flow.css">
    <script src="/static/js/auth-flow.js"></script>
    <style>
        :root {
            --bg-color: #0b0d12;
            --card-bg: rgba(22, 27, 38, 0.78);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-primary: #6366f1;
            --accent-secondary: #a855f7;
            --primary: #8b5cf6;
            --accent: #ec4899;
            --cyan: #67e8f9;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            background:
                radial-gradient(circle at 14% 12%, rgba(99, 102, 241, 0.18), transparent 32rem),
                radial-gradient(circle at 86% 84%, rgba(168, 85, 247, 0.16), transparent 28rem),
                var(--bg-color);
        }

        main {
            width: min(940px, calc(100% - 3rem));
            margin: 0 auto;
            padding: 3.5rem 0 5rem;
        }

        .policy-header {
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .policy-badge-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .policy-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.35rem 0.8rem;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: rgba(99, 102, 241, 0.18);
            border: 1px solid rgba(129, 140, 248, 0.3);
            color: var(--cyan);
        }

        .policy-badge-draft {
            background: rgba(236, 72, 153, 0.15);
            border-color: rgba(236, 72, 153, 0.35);
            color: #f472b6;
        }

        .policy-nav-tabs {
            display: flex;
            gap: 0.5rem;
            background: rgba(15, 23, 42, 0.6);
            padding: 0.35rem;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .policy-tab {
            padding: 0.5rem 1.1rem;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }

        .policy-tab:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.06);
        }

        .policy-tab.active {
            color: #ffffff;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
        }

        .content {
            padding: clamp(1.8rem, 5vw, 3.8rem);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            background: var(--card-bg);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.32);
            backdrop-filter: blur(16px);
        }

        h1, h2, h3, h4 { color: var(--text-primary); }
        h1 {
            margin: 0 0 0.8rem;
            font-size: clamp(2.4rem, 5vw, 3.6rem);
            line-height: 1.1;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, #f8fafc, #a5b4fc 55%, #67e8f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 {
            margin: 2.8rem 0 1.15rem;
            padding-bottom: 0.65rem;
            border-bottom: 1px solid var(--card-border);
            font-size: 1.55rem;
            letter-spacing: -0.02em;
            color: #f1f5f9;
        }

        h3 {
            margin: 1.6rem 0 0.5rem;
            font-size: 1.15rem;
            color: #c4b5fd;
        }

        p, li {
            color: var(--text-secondary);
            font-size: 1.02rem;
            line-height: 1.75;
        }

        p { margin: 0.6rem 0 1rem; }
        ul, ol { padding-left: 1.4rem; margin-bottom: 1.2rem; }
        li { margin-bottom: 0.35rem; }

        a {
            color: #67e8f9;
            text-decoration: none;
            transition: color 0.15s ease;
        }
        a:hover {
            color: #a5f3fc;
            text-decoration: underline;
        }

        code {
            padding: 0.15rem 0.35rem;
            border-radius: 4px;
            background: rgba(99, 102, 241, 0.2);
            color: #c4b5fd;
            font-size: 0.9em;
        }

        hr {
            margin: 2.2rem 0;
            border: 0;
            border-top: 1px solid var(--card-border);
        }

        .policy-footer-note {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--card-border);
            font-size: 0.88rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        @media (max-width: 650px) {
            main { width: min(100% - 2rem, 940px); padding: 2rem 0; }
            .policy-header { flex-direction: column; align-items: flex-start; }
            .policy-nav-tabs { width: 100%; justify-content: stretch; }
            .policy-tab { flex: 1; text-align: center; }
        }
    </style>
</head>
<body>
    <!-- SHARED_TOPBAR -->
    <main>
        <div class="policy-header">
            <div class="policy-badge-group">
                <span class="policy-badge">Legal &amp; Policies</span>
                <span class="policy-badge policy-badge-draft">Draft Placeholder</span>
            </div>
            <nav class="policy-nav-tabs" aria-label="Policy Navigation">
                <a href="/terms" class="policy-tab <!-- TERMS_ACTIVE -->" id="tabTermsLink">Terms of Service</a>
                <a href="/privacy" class="policy-tab <!-- PRIVACY_ACTIVE -->" id="tabPrivacyLink">Privacy Policy</a>
            </nav>
        </div>

        <article class="content" id="policyContentArea">
            <!-- POLICY_CONTENT -->
            <div class="policy-footer-note">
                <span>Narratron Interactive Storytelling Platform</span>
                <span>Questions? Visit <a href="/docs/about">About Narratron</a></span>
            </div>
        </article>
    </main>
</body>
</html>
