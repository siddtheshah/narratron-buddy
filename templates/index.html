<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narratron Canvas</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1115;
            --text-color: #ffffff;
            --accent-color: #6366f1;
            --glass-bg: rgba(15, 17, 21, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            padding: 1.5rem;
            gap: 1.5rem;
            box-sizing: border-box;
        }

        /* The blurred background layer */
        #bg-layer {
            position: absolute;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            background-size: cover;
            background-position: center;
            filter: blur(20px) brightness(0.4);
            z-index: 0;
            transition: background-image 1s ease-in-out;
        }

        #main-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            flex: 1;
            height: 100%;
            gap: 1rem;
            min-width: 0;
        }

        /* Top Bar & Bottom Bar Styling */
        header {
            position: relative;
            z-index: 2;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            align-self: center;
            max-width: 100%;
        }

        #bottom-bar {
            position: relative;
            z-index: 2;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            align-self: center;
            max-width: 100%;
        }

        /* The main image container */
        #image-container {
            position: relative;
            z-index: 1;
            width: 100%;
            flex: 1;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
        }

        #current-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 2.5s ease-in-out;
        }

        #current-image.loaded {
            opacity: 1;
        }

        /* Ghost image used for crossfade: sits on top and fades out as current-image fades in */
        #ghost-image {
            position: absolute;
            inset: 0;
            max-width: 100%;
            max-height: 100%;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            pointer-events: none;
            z-index: 3;
            transition: opacity 2.5s ease-in-out;
        }

        #ghost-image.fading-out {
            opacity: 1;
            animation: ghost-fade-out 2.5s ease-in-out forwards;
        }

        @keyframes ghost-fade-out {
            from { opacity: 1; }
            to   { opacity: 0; }
        }


        #doodle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: auto;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981, 0 0 20px #10b981;
            animation: pulse 2s infinite;
        }

        .status-dot.disconnected {
            background-color: #ef4444 !important;
            box-shadow: 0 0 10px #ef4444, 0 0 20px #ef4444 !important;
            animation: none !important;
        }

        @keyframes micPulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        
        .recording-active {
            animation: micPulse 1.5s infinite !important;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, #a5b4fc);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #prompt-toggle-btn {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 15;
            min-height: 44px;
            height: 44px;
            width: 44px;
            border-radius: 22px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0 11px;
            box-sizing: border-box;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            max-width: 44px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: none; /* Controlled by JS when prompt is available */
        }

        #prompt-toggle-btn svg {
            flex-shrink: 0;
            margin-right: 0px;
            transition: margin-right 0.3s ease;
            color: #a5b4fc;
            margin-top: 2px;
        }

        #prompt-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        #prompt-toggle-btn.expanded {
            width: auto;
            height: auto;
            max-width: 70%;
            max-height: 300px;
            border-radius: 16px;
            padding: 12px 16px 12px 12px;
            background: rgba(15, 17, 21, 0.9);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            align-items: flex-start;
            overflow-y: auto;
        }

        #prompt-toggle-btn.expanded::-webkit-scrollbar {
            width: 4px;
        }
        #prompt-toggle-btn.expanded::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        #prompt-toggle-btn.expanded svg {
            margin-right: 10px;
            color: #6366f1;
        }

        #prompt-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0;
            max-width: 0;
            transition: opacity 0.2s ease, max-width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            color: #e2e8f0;
            font-size: 0.9rem;
            font-weight: 300;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            display: inline-block;
        }

        #prompt-toggle-btn.expanded #prompt-text {
            opacity: 1;
            max-width: 100%;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.45;
        }

        #chat-sidebar {
            position: relative;
            width: 320px;
            height: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 10;
            flex-shrink: 0;
        }

        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        /* Customize scrollbar */
        #chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        #chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .chat-message {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.75rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
            line-height: 1.4;
            color: #cbd5e1;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #chat-form {
            display: flex;
            padding: 1rem;
            border-top: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
            gap: 0.5rem;
        }

        #chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 0.5rem 1rem;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            outline: none;
            transition: all 0.2s ease;
            min-width: 0; /* fixes flex item stretching */
        }

        #chat-input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent-color);
        }

        #chat-form button {
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 20px;
            padding: 0.5rem 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Outfit', sans-serif;
        }

        #chat-form button:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }

        #doodle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: auto;
            cursor: crosshair;
        }

        #doodle-toolbar {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        
        .color-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s;
        }
        
        .color-btn:hover {
            transform: scale(1.1);
        }
        
        .color-btn.active {
            border-color: var(--text-color);
        }
        
        .eraser-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
        }
        
        #brush-size {
            margin: 0 0.5rem;
            width: 80px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        #music-volume-slider {
            width: 70px;
            accent-color: var(--accent-color);
            cursor: pointer;
            height: 4px;
            border-radius: 2px;
            outline: none;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
            vertical-align: middle;
        }

        #music-volume-slider:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        #clear-doodle-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid var(--glass-border);
            padding: 0.25rem 0.75rem;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            margin-left: 0.5rem;
            transition: background 0.2s;
        }
        
        #clear-doodle-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .share-toast {
            position: fixed;
            top: 4.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(-10px) scale(0.9);
            background: rgba(15, 23, 42, 0.9);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .share-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
        }

    </style>
</head>
<body>

    <div id="bg-layer"></div>

    <div id="main-container">
        <header>
            <a id="back-btn" href="/" title="Back to Deployer" style="text-decoration: none; background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); color: #f8fafc; border-radius: 50%; width: 34px; height: 34px; font-size: 0.9rem; font-weight: 500; display: flex; align-items: center; justify-content: center; transition: all 0.2s; font-family: inherit; padding: 0;">
                ←
            </a>
            <div class="status-dot" id="status-indicator"></div>
            <h1>Narratron Canvas</h1>
            <button id="share-session-btn" title="Copy session share link" style="background: rgba(99, 102, 241, 0.2); border: 1px solid rgba(99, 102, 241, 0.4); color: #a5b4fc; border-radius: 50%; width: 34px; height: 34px; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; font-family: inherit; padding: 0;">
                🔗
            </button>
            <button id="save-session-btn" title="Save session to database" style="background: rgba(34, 197, 94, 0.2); border: 1px solid rgba(34, 197, 94, 0.4); color: #4ade80; border-radius: 50%; width: 34px; height: 34px; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; font-family: inherit; padding: 0;">
                💾
            </button>

            <!-- Orator Audio controls (Connect & Mic) -->
            <div id="orator-controls" style="display: none; align-items: center; gap: 10px; margin-left: 1rem; border-left: 1px solid var(--glass-border); padding-left: 1rem;">
                <button id="agent-connect-btn" style="background: #3b82f6; border: none; color: #fff; border-radius: 20px; padding: 6px 14px; font-size: 0.8rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.2s;">
                    🔌 Connect Agent
                </button>
                <button id="agent-mic-btn" style="background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); color: #94a3b8; border-radius: 20px; padding: 6px 14px; font-size: 0.8rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.2s;" disabled>
                    🎤 Mic Off
                </button>
                <button id="mic-hotkey-btn" title="Click to change mic hotkey" style="background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); color: #a5b4fc; border-radius: 20px; padding: 6px 14px; font-size: 0.8rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.2s;">
                    ⌨️ <span id="hotkey-display">Hotkey: M</span>
                </button>
            </div>

            <!-- Role Indicator & Toggle (Orator switch) -->
            <div id="role-container" style="margin-left: 1rem; display: flex; align-items: center; gap: 10px; border-left: 1px solid var(--glass-border); padding-left: 1rem;">
                <span id="role-badge" style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #a5b4fc; background: rgba(99, 102, 241, 0.2); padding: 4px 10px; border-radius: 12px; border: 1px solid rgba(99, 102, 241, 0.4);">Viewer</span>
                <button id="role-toggle-btn" style="background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); color: #fff; border-radius: 20px; padding: 4px 12px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; font-family: inherit;">Switch to Orator</button>
            </div>
        </header>

        <div id="image-container">
            <img id="current-image" src="" alt="Narratron Generation">
            <canvas id="doodle-canvas"></canvas>
            <div id="prompt-toggle-btn" title="View Prompt">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3Z"/>
                </svg>
                <span id="prompt-text"></span>
            </div>
        </div>

        <div id="bottom-bar">
            <!-- Music controls -->
            <div id="music-controls" style="display: flex; align-items: center; gap: 10px;">
                <span id="music-status" style="font-size: 0.8rem; color: #a5b4fc; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">🎵 Silent</span>
                <button id="music-mute-btn" style="background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); color: #fff; border-radius: 20px; padding: 4px 12px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; font-family: inherit; display: flex; align-items: center; gap: 5px;">🔊 Mute</button>
                <div id="volume-container" style="display: flex; align-items: center; gap: 8px;">
                    <input type="range" id="music-volume-slider" min="0" max="1" step="0.01" value="0.5" title="Volume">
                    <span id="volume-percent" style="font-size: 0.75rem; color: #a5b4fc; min-width: 32px;">50%</span>
                </div>
            </div>

            <!-- Doodle toggle button (Orator control) & palette controls -->
            <div id="doodle-section" style="display: flex; align-items: center; gap: 10px; border-left: 1px solid var(--glass-border); padding-left: 1.5rem;">
                <button id="doodles-toggle-btn" title="Toggle doodle display on canvas" style="display: none; background: rgba(99, 102, 241, 0.2); border: 1px solid rgba(99, 102, 241, 0.4); color: #a5b4fc; border-radius: 20px; padding: 4px 12px; font-size: 0.8rem; font-weight: 600; cursor: pointer; align-items: center; gap: 5px; transition: all 0.2s; font-family: inherit;">
                    ✏️ Doodles: On
                </button>
                <div id="doodle-toolbar" style="display: flex; align-items: center; gap: 0.5rem;">
                    <div class="color-btn" style="background: #ef4444;" data-color="#ef4444"></div>
                    <div class="color-btn" style="background: #22c55e;" data-color="#22c55e"></div>
                    <div class="color-btn active" style="background: #ffffff;" data-color="#ffffff"></div>
                    <div class="color-btn" style="background: #3b82f6;" data-color="#3b82f6"></div>
                    <div class="color-btn" style="background: #eab308;" data-color="#eab308"></div>
                    <div class="color-btn eraser-btn" data-color="erase" title="Eraser">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"></path>
                            <path d="M22 21H7"></path>
                            <path d="m5 11 9 9"></path>
                        </svg>
                    </div>
                    <input type="range" id="brush-size" min="1" max="40" value="3" title="Brush Size">
                    <button id="clear-doodle-btn">Clear</button>
                </div>
            </div>
        </div>
    </div>

    <div id="chat-sidebar">
        <div id="chat-messages"></div>
        <form id="chat-form">
            <input type="text" id="chat-input" placeholder="Type an idea..." autocomplete="off" required>
            <button type="submit">Send</button>
        </form>
    </div>

    <script type="module">
        import { startAudioRecorderWorklet, stopMicrophone } from "/static/js/audio-recorder.js";

        let lastTime = -1;
        const currentImage = document.getElementById('current-image');
        const bgLayer = document.getElementById('bg-layer');
        const promptTextSpan = document.getElementById('prompt-text');
        const chatMessages = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        
        // Generate anonymous user ID
        const myUserId = "Viewer_" + Math.floor(Math.random() * 10000);
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');
        if (!sessionId) {
            console.error("Session ID missing from URL parameters.");
            const container = document.getElementById('image-container');
            if (container) {
                container.innerHTML = `
                    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #f87171; text-align: center; padding: 2rem;">
                        <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem; font-weight: 600;">⚠️ No Active Session</h2>
                        <p style="color: #94a3b8; max-width: 400px; margin-bottom: 1.5rem; font-size: 0.95rem;">No session ID was specified in the URL. Please launch or join a session from the deployer page.</p>
                        <a href="/deploy" style="background: rgba(99, 102, 241, 0.2); border: 1px solid rgba(99, 102, 241, 0.4); color: #a5b4fc; padding: 0.6rem 1.2rem; border-radius: 20px; text-decoration: none; font-size: 0.9rem; transition: all 0.2s;">Go to Deployer Dashboard →</a>
                    </div>
                `;
            }
            throw new Error("Missing required session_id parameter in URL");
        }

        // Music player controls and state
        let currentPlaylistTracks = [];
        let currentTrackIndex = 0;
        let bgMusic = new Audio();
        let isMuted = false;
        let lastPlaylistTime = 0;
        let activePlaylistName = null;
        let fadeInterval = null;

        const musicMuteBtn = document.getElementById('music-mute-btn');
        const musicStatusSpan = document.getElementById('music-status');
        const musicVolumeSlider = document.getElementById('music-volume-slider');
        const volumePercentSpan = document.getElementById('volume-percent');

        // Set initial volume and mute state
        bgMusic.volume = parseFloat(musicVolumeSlider.value);
        bgMusic.muted = isMuted;

        bgMusic.addEventListener('ended', () => {
            playNextTrack();
        });

        function cancelFade() {
            if (fadeInterval) {
                clearInterval(fadeInterval);
                fadeInterval = null;
            }
        }

        function fadeIn(durationMs = 2000) {
            cancelFade();
            const targetVolume = parseFloat(musicVolumeSlider.value);
            if (isMuted || targetVolume === 0) {
                bgMusic.volume = targetVolume;
                return;
            }

            bgMusic.volume = 0;
            const startTime = Date.now();

            fadeInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(1, elapsed / durationMs);
                const currentTarget = parseFloat(musicVolumeSlider.value);
                bgMusic.volume = progress * currentTarget;

                if (progress >= 1) {
                    cancelFade();
                    bgMusic.volume = currentTarget;
                }
            }, 30);
        }

        function fadeOut(onComplete, durationMs = 800) {
            cancelFade();
            if (bgMusic.paused || bgMusic.volume === 0 || isMuted) {
                if (onComplete) onComplete();
                return;
            }

            const startVolume = bgMusic.volume;
            const startTime = Date.now();

            fadeInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(1, elapsed / durationMs);
                bgMusic.volume = Math.max(0, startVolume * (1 - progress));

                if (progress >= 1) {
                    cancelFade();
                    if (onComplete) onComplete();
                }
            }, 30);
        }

        function playPlaylist(tracks) {
            console.log("Playing playlist tracks:", tracks);
            currentPlaylistTracks = tracks;
            currentTrackIndex = 0;
            if (currentPlaylistTracks.length > 0) {
                playTrack(currentPlaylistTracks[currentTrackIndex]);
            }
        }

        function playTrack(src) {
            console.log("Playing track:", src);
            if (!bgMusic.paused && bgMusic.src) {
                fadeOut(() => {
                    startTrack(src);
                }, 500);
            } else {
                startTrack(src);
            }
        }

        function startTrack(src) {
            bgMusic.src = src;
            bgMusic.muted = isMuted;
            const targetVol = parseFloat(musicVolumeSlider.value);
            if (!isMuted && targetVol > 0) {

            } else {

            } else if (data.type === 'clear') {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            } else if (data.type === 'draw') {
                const bSize = data.size || 3;
                drawLine(data.x0 * canvas.width, data.y0 * canvas.height, 
                         data.x1 * canvas.width, data.y1 * canvas.height,

        function drawLine(x0, y0, x1, y1, color, size, emit) {
            ctx.beginPath();
            if (color === 'erase') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.strokeStyle = 'rgba(0,0,0,1)';
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = color;
            }
            
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1);
            ctx.lineWidth = size;
            ctx.lineCap = 'round';
            ctx.stroke();
            ctx.closePath();
            
            ctx.globalCompositeOperation = 'source-over';

            if (!emit) return;
            
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'draw',
                    x0: x0 / canvas.width,
                    y0: y0 / canvas.height,
                    x1: x1 / canvas.width,
                    y1: y1 / canvas.height,
                    color: color,
                    size: size

                            let clean = str.replace(/<ctrl>|<shift>|<alt>|\+| /gi, '');
                            let code = clean;
                            let key = clean;
                            if (clean === '[') { code = 'BracketLeft'; key = '['; }
                            else if (clean === ']') { code = 'BracketRight'; key = ']'; }
                            else if (clean.length === 1 && clean.match(/[a-z]/i)) { code = 'Key' + clean.toUpperCase(); key = clean.toLowerCase(); }
                            else if (clean.length === 1 && clean.match(/[0-9]/)) { code = 'Digit' + clean; key = clean; }
                            currentHotkey = { code, key, altKey: alt, ctrlKey: ctrl, shiftKey: shift };
                            updateHotkeyUI();
                        }
                    }).catch(() => {});
            }
        } catch(e) {}

        function formatHotkeyLabel(hk) {
            let parts = [];
            if (hk.ctrlKey) parts.push('Ctrl');
            if (hk.altKey) parts.push('Alt');
            if (hk.shiftKey) parts.push('Shift');

            let codeLabel = hk.code || hk.key || '[';
            if (codeLabel.startsWith('Key')) {
                codeLabel = codeLabel.replace('Key', '');
            } else if (codeLabel.startsWith('Digit')) {
                codeLabel = codeLabel.replace('Digit', '');
            } else if (codeLabel === 'BracketLeft') {
                codeLabel = '[';
            } else if (codeLabel === 'BracketRight') {
                codeLabel = ']';
            } else if (codeLabel === 'Backquote') {
                codeLabel = '`';
            } else if (codeLabel === 'Semicolon') {
                codeLabel = ';';
            } else if (codeLabel === 'Quote') {
                codeLabel = "'";
            } else if (codeLabel === 'Comma') {
                codeLabel = ',';
            } else if (codeLabel === 'Period') {
                codeLabel = '.';
            } else if (codeLabel === 'Slash') {
                codeLabel = '/';
            } else if (codeLabel === 'Backslash') {
                codeLabel = '\\';
            } else if (codeLabel === 'Minus') {
                codeLabel = '-';
            } else if (codeLabel === 'Equal') {
                codeLabel = '=';
            } else if (codeLabel === 'Space') {
                codeLabel = 'Space';
            }
            parts.push(codeLabel.toUpperCase());
            return parts.join(' + ');
        }

        function updateHotkeyUI() {
            if (hotkeyDisplay) {
                hotkeyDisplay.textContent = `Hotkey: ${formatHotkeyLabel(currentHotkey)}`;
            }
        }

        updateHotkeyUI();

        // Rebind hotkey click handler
        if (micHotkeyBtn) {
            micHotkeyBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (isRebindingHotkey) return;
                
                isRebindingHotkey = true;
                micHotkeyBtn.style.background = '#eab308';
                micHotkeyBtn.style.color = '#000';
                hotkeyDisplay.textContent = 'Press any key...';
            });
        }

        // Global Keydown Listener for Hotkey
        window.addEventListener('keydown', (e) => {
            if (!isOrator) return;

            // Rebinding hotkey state
            if (isRebindingHotkey) {
                e.preventDefault();
                e.stopPropagation();

                // If user presses Escape, cancel rebinding
                if (e.code === 'Escape') {
                    isRebindingHotkey = false;
                    micHotkeyBtn.style.background = 'rgba(255,255,255,0.08)';
                    micHotkeyBtn.style.color = '#a5b4fc';
                    updateHotkeyUI();
                    return;
                }

                // Ignore standalone modifier keypresses
                if (['ControlLeft', 'ControlRight', 'AltLeft', 'AltRight', 'ShiftLeft', 'ShiftRight', 'MetaLeft', 'MetaRight'].includes(e.code)) {
                    return;
                }

                currentHotkey = {
                    code: e.code,
                    key: e.key,
                    altKey: e.altKey,
                    ctrlKey: e.ctrlKey,
                    shiftKey: e.shiftKey
                };

                try {
                    localStorage.setItem('narratron_mic_hotkey', JSON.stringify(currentHotkey));
                } catch(err) {}

                isRebindingHotkey = false;
                micHotkeyBtn.style.background = '#10b981';
                micHotkeyBtn.style.color = '#fff';
                updateHotkeyUI();

                setTimeout(() => {
                    micHotkeyBtn.style.background = 'rgba(255,255,255,0.08)';
                    micHotkeyBtn.style.color = '#a5b4fc';
                }, 600);
                return;
            }

            // Normal hotkey listening for toggling mic
            if (e.repeat) return;

            // Do not trigger hotkey if typing in input or textarea
            const activeEl = document.activeElement;
            if (activeEl && (['INPUT', 'TEXTAREA', 'SELECT'].includes(activeEl.tagName) || activeEl.isContentEditable)) {
                return;
            }

            // Match current hotkey
            const matchCode = e.code === currentHotkey.code;
            const matchAlt = !!e.altKey === !!currentHotkey.altKey;
            const matchCtrl = !!e.ctrlKey === !!currentHotkey.ctrlKey;
            const matchShift = !!e.shiftKey === !!currentHotkey.shiftKey;

            if (matchCode && matchAlt && matchCtrl && matchShift) {
                e.preventDefault();
                
                if (agentWs && agentWs.readyState === WebSocket.OPEN && !agentMicBtn.disabled) {
                    agentMicBtn.click();
                } else if (!agentWs || agentWs.readyState !== WebSocket.OPEN) {
                    console.log("[Hotkey] Cannot toggle mic: Agent not connected.");
                    agentConnectBtn.style.transform = 'scale(1.05)';
                    setTimeout(() => agentConnectBtn.style.transform = 'none', 200);
                }
            }
        });

        window.setMicHotkey = (code) => {
            currentHotkey = { code: code, key: code, altKey: false, ctrlKey: false, shiftKey: false };
            try { localStorage.setItem('narratron_mic_hotkey', JSON.stringify(currentHotkey)); } catch(e) {}
            updateHotkeyUI();
        };

        // Expose helper functions on window for automated evaluation
        window.enableAudioInput = () => {
            isRecording = true;
            agentMicBtn.innerHTML = '<span class="icon">🎙️</span> Mic Active';
            agentMicBtn.style.background = '#ef4444';
            agentMicBtn.classList.add('recording-active');
        };

        window.connectAgentAndMic = () => {
            connectAgent();
            const checkConnect = setInterval(() => {
                if (agentWs && agentWs.readyState === WebSocket.OPEN) {
                    window.enableAudioInput();
                    clearInterval(checkConnect);
                }
            }, 100);
        };

        window.sendOratorAudio = (base64Data) => {
            const ws = window.agentWs || agentWs;
            if (ws && ws.readyState === WebSocket.OPEN) {
                const binary = atob(base64Data);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                ws.send(bytes.buffer);
            } else {
                console.warn("[OratorAudio] WebSocket not ready. State:", ws ? ws.readyState : "null");
            }
        };

        window.streamFullAudio = async (fullBase64Data, chunkSize = 2048, delayMs = 64) => {
            const binary = atob(fullBase64Data);
            const totalBytes = binary.length;
            let offset = 0;
            const ws = window.agentWs || agentWs;
            
            return new Promise((resolve) => {
                const interval = setInterval(() => {
                    if (offset >= totalBytes) {
                        clearInterval(interval);
                        resolve();
                        return;
                    }
                    const end = Math.min(offset + chunkSize, totalBytes);
                    const chunk = new Uint8Array(end - offset);
                    for (let i = offset; i < end; i++) {
                        chunk[i - offset] = binary.charCodeAt(i);
                    }
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(chunk.buffer);
                    }
                    offset = end;
                }, delayMs);
            });
        };
    </script>
</body>
