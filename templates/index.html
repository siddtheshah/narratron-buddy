<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narratron Canvas</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1115;
            --text-color: #ffffff;
            --accent-color: #6366f1;
            --glass-bg: rgba(15, 17, 21, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding-left: 2rem;
            box-sizing: border-box;
        }

        /* The blurred background layer */
        #bg-layer {
            position: absolute;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            background-size: cover;
            background-position: center;
            filter: blur(20px) brightness(0.4);
            z-index: 0;
            transition: background-image 1s ease-in-out;
        }

        /* The main image container */
        #image-container {
            position: relative;
            z-index: 1;
            width: calc(100vw - 380px); /* Leave room for sidebar and padding */
            height: 85vh;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #current-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        #current-image.loaded {
            opacity: 1;
        }

        /* Glassmorphism Header */
        header {
            position: absolute;
            top: 2rem;
            left: calc((100vw - 380px) / 2 + 2rem);
            transform: translateX(-50%);
            z-index: 2;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 1rem 2rem;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideDown {
            from { top: -5rem; opacity: 0; }
            to { top: 2rem; opacity: 1; }
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981, 0 0 20px #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, #a5b4fc);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .loader {
            position: absolute;
            width: 48px;
            height: 48px;
            border: 5px solid #FFF;
            border-bottom-color: var(--accent-color);
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
            z-index: 0;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #prompt-toggle-btn {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            z-index: 15;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s ease;
            display: none;
        }

        #prompt-toggle-btn:hover {
            transform: scale(1.1);
            background: rgba(255,255,255,0.2);
        }

        #prompt-overlay {
            position: absolute;
            bottom: 4rem;
            left: 1rem;
            width: auto;
            max-width: 60%;
            padding: 1rem 1.5rem;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            border-bottom-left-radius: 0px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            color: #e2e8f0;
            font-size: 1rem;
            text-align: left;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            transform: translateY(10px);
            z-index: 15;
            pointer-events: none;
            /* Nice subtle glow text */
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            font-weight: 300;
        }

        #prompt-overlay.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        #chat-sidebar {
            position: absolute;
            right: 2rem;
            top: 2rem;
            bottom: 2rem;
            width: 320px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        /* Customize scrollbar */
        #chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        #chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .chat-message {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.75rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
            line-height: 1.4;
            color: #cbd5e1;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #chat-form {
            display: flex;
            padding: 1rem;
            border-top: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
            gap: 0.5rem;
        }

        #chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 0.5rem 1rem;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            outline: none;
            transition: all 0.2s ease;
            min-width: 0; /* fixes flex item stretching */
        }

        #chat-input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent-color);
        }

        #chat-form button {
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 20px;
            padding: 0.5rem 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Outfit', sans-serif;
        }

        #chat-form button:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }

        #doodle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: auto;
            cursor: crosshair;
        }

        #doodle-toolbar {
            position: absolute;
            top: 1rem;
            left: 1rem;
            z-index: 10;
            display: flex;
            gap: 0.5rem;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 0.5rem;
            border-radius: 15px;
            border: 1px solid var(--glass-border);
            align-items: center;
        }
        
        .color-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s;
        }
        
        .color-btn:hover {
            transform: scale(1.1);
        }
        
        .color-btn.active {
            border-color: var(--text-color);
        }
        
        .eraser-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
        }
        
        #brush-size {
            margin: 0 0.5rem;
            width: 80px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }
        
        #clear-doodle-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid var(--glass-border);
            padding: 0.25rem 0.75rem;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            margin-left: 0.5rem;
            transition: background 0.2s;
        }
        
        #clear-doodle-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

    </style>
</head>
<body>

    <div id="bg-layer"></div>

    <header>
        <div class="status-dot" id="status-indicator"></div>
        <h1>Narratron Canvas</h1>
    </header>

    <div id="image-container">
        <div class="loader" id="loader"></div>
        <img id="current-image" src="" alt="Narratron Generation">
        <canvas id="doodle-canvas"></canvas>
        <div id="doodle-toolbar">
            <div class="color-btn" style="background: #ef4444;" data-color="#ef4444"></div>
            <div class="color-btn" style="background: #22c55e;" data-color="#22c55e"></div>
            <div class="color-btn active" style="background: #ffffff;" data-color="#ffffff"></div>
            <div class="color-btn" style="background: #3b82f6;" data-color="#3b82f6"></div>
            <div class="color-btn" style="background: #eab308;" data-color="#eab308"></div>
            <div class="color-btn eraser-btn" data-color="erase" title="Eraser">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"></path>
                    <path d="M22 21H7"></path>
                    <path d="m5 11 9 9"></path>
                </svg>
            </div>
            <input type="range" id="brush-size" min="1" max="40" value="3" title="Brush Size">
            <button id="clear-doodle-btn">Clear</button>
        </div>
        <div id="prompt-toggle-btn" title="View Prompt">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3Z"/>
            </svg>
        </div>
        <div id="prompt-overlay"></div>
    </div>

    <div id="chat-sidebar">
        <div id="chat-messages"></div>
        <form id="chat-form">
            <input type="text" id="chat-input" placeholder="Type an idea..." autocomplete="off" required>
            <button type="submit">Send</button>
        </form>
    </div>

    <script>
        let lastTime = 0;
        const currentImage = document.getElementById('current-image');
        const bgLayer = document.getElementById('bg-layer');
        const loader = document.getElementById('loader');
        const promptOverlay = document.getElementById('prompt-overlay');
        const chatMessages = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        
        // Generate anonymous user ID
        const myUserId = "Viewer_" + Math.floor(Math.random() * 10000);
        
        const promptBtn = document.getElementById('prompt-toggle-btn');
        let promptPinned = false;

        promptBtn.addEventListener('mouseenter', () => {
            promptOverlay.classList.add('visible');
        });

        promptBtn.addEventListener('mouseleave', () => {
            if (!promptPinned) {
                promptOverlay.classList.remove('visible');
            }
        });

        promptBtn.addEventListener('click', () => {
            promptPinned = !promptPinned;
            if (!promptPinned) {
                promptOverlay.classList.remove('visible');
            } else {
                promptOverlay.classList.add('visible');
            }
        });

        async function fetchLatestImage() {
            try {
                const response = await fetch('/api/latest');
                const data = await response.json();
                
                if (data.latest && data.time > lastTime) {
                    lastTime = data.time;
                    
                    const newImgUrl = data.latest + "?t=" + new Date().getTime();
                    const tempImage = new Image();
                    
                    tempImage.onload = () => {
                        loader.style.display = 'none';
                        currentImage.classList.remove('loaded');
                        promptOverlay.classList.remove('visible');
                        promptBtn.style.display = 'none';
                        promptPinned = false;
                        
                        setTimeout(() => {
                            currentImage.src = newImgUrl;
                            bgLayer.style.backgroundImage = `url(${newImgUrl})`;
                            currentImage.classList.add('loaded');
                            
                            if (data.prompt) {
                                promptOverlay.textContent = data.prompt;
                                promptBtn.style.display = 'flex';
                            }
                        }, 500);
                    };
                    
                    tempImage.src = newImgUrl;
                }
            } catch (err) {
                console.error("Failed to fetch image data:", err);
            }
        }

        let lastMessageCount = 0;
        async function fetchChat() {
            try {
                const response = await fetch('/api/chat');
                const messages = await response.json();
                if (messages.length !== lastMessageCount) {
                    chatMessages.innerHTML = '';
                    messages.forEach(msg => {
                        const div = document.createElement('div');
                        div.className = 'chat-message';
                        div.textContent = msg.text;
                        chatMessages.appendChild(div);
                    });
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                    lastMessageCount = messages.length;
                }
            } catch (err) {
                console.error("Failed to fetch chat:", err);
            }
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (!text) return;
            
            chatInput.value = '';
            try {
                await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ author: myUserId, text: text })
                });
                fetchChat();
            } catch (err) {
                console.error("Failed to send message:", err);
            }
        });

        // Doodle Logic
        const canvas = document.getElementById('doodle-canvas');
        const ctx = canvas.getContext('2d');
        const colorBtns = document.querySelectorAll('.color-btn');
        const clearBtn = document.getElementById('clear-doodle-btn');
        const brushSizeSlider = document.getElementById('brush-size');

        let currentColor = '#ffffff';
        let currentBrushSize = 3;
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        
        brushSizeSlider.addEventListener('input', (e) => {
            currentBrushSize = parseInt(e.target.value);
        });

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        colorBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                colorBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentColor = btn.dataset.color;
            });
        });

        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws/doodle`);

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'clear') {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            } else if (data.type === 'draw') {
                const bSize = data.size || 3;
                drawLine(data.x0 * canvas.width, data.y0 * canvas.height, 
                         data.x1 * canvas.width, data.y1 * canvas.height, 
                         data.color, bSize, false);
            }
        };

        function drawLine(x0, y0, x1, y1, color, size, emit) {
            ctx.beginPath();
            if (color === 'erase') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.strokeStyle = 'rgba(0,0,0,1)';
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = color;
            }
            
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1);
            ctx.lineWidth = size;
            ctx.lineCap = 'round';
            ctx.stroke();
            ctx.closePath();
            
            ctx.globalCompositeOperation = 'source-over';

            if (!emit) return;
            
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'draw',
                    x0: x0 / canvas.width,
                    y0: y0 / canvas.height,
                    x1: x1 / canvas.width,
                    y1: y1 / canvas.height,
                    color: color,
                    size: size
                }));
            }
        }

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            lastX = e.offsetX;
            lastY = e.offsetY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            drawLine(lastX, lastY, e.offsetX, e.offsetY, currentColor, currentBrushSize, true);
            lastX = e.offsetX;
            lastY = e.offsetY;
        });

        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseout', () => isDrawing = false);

        clearBtn.addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'clear' }));
            }
        });

        const originalTempImageOnload = fetchLatestImage.toString(); // We'll just hook logic inside the interval loop.
        
        // Let's hook the image clearance when `lastTime` shifts explicitly.
        let previousImgTime = lastTime;

        setInterval(() => {
            fetchLatestImage();
            if (lastTime > previousImgTime) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                previousImgTime = lastTime;
            }
        }, 1000);
        setInterval(fetchChat, 1000);
        fetchLatestImage();
        fetchChat();
    </script>
</body>
</html>
