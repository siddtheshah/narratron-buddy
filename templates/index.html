<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narratron Canvas</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1115;
            --text-color: #ffffff;
            --accent-color: #6366f1;
            --glass-bg: rgba(15, 17, 21, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding-left: 2rem;
            box-sizing: border-box;
        }

        /* The blurred background layer */
        #bg-layer {
            position: absolute;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            background-size: cover;
            background-position: center;
            filter: blur(20px) brightness(0.4);
            z-index: 0;
            transition: background-image 1s ease-in-out;
        }

        /* The main image container */
        #image-container {
            position: relative;
            z-index: 1;
            width: calc(100vw - 380px); /* Leave room for sidebar and padding */
            height: 85vh;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #current-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        #current-image.loaded {
            opacity: 1;
        }

        /* Glassmorphism Header */
        header {
            position: absolute;
            top: 2rem;
            left: calc((100vw - 380px) / 2 + 2rem);
            transform: translateX(-50%);
            z-index: 2;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 1rem 2rem;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideDown {
            from { top: -5rem; opacity: 0; }
            to { top: 2rem; opacity: 1; }
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981, 0 0 20px #10b981;
            animation: pulse 2s infinite;
        }

        .status-dot.disconnected {
            background-color: #ef4444 !important;
            box-shadow: 0 0 10px #ef4444, 0 0 20px #ef4444 !important;
            animation: none !important;
        }

        @keyframes micPulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        
        .recording-active {
            animation: micPulse 1.5s infinite !important;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, #a5b4fc);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .loader {
            position: absolute;
            width: 48px;
            height: 48px;
            border: 5px solid #FFF;
            border-bottom-color: var(--accent-color);
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
            z-index: 0;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #prompt-toggle-btn {
            position: absolute;
            bottom: 1.5rem;
            left: 1.5rem;
            z-index: 15;
            height: 44px;
            width: 44px;
            border-radius: 22px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0 11px;
            box-sizing: border-box;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            max-width: 44px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: none; /* Controlled by JS when prompt is available */
        }

        #prompt-toggle-btn svg {
            flex-shrink: 0;
            margin-right: 0px;
            transition: margin-right 0.3s ease;
            color: #a5b4fc;
        }

        #prompt-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        #prompt-toggle-btn.expanded {
            width: auto;
            max-width: 80%; /* Don't overflow the container */
            border-radius: 22px;
            padding: 0 16px 0 12px;
            background: rgba(15, 17, 21, 0.85);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        #prompt-toggle-btn.expanded svg {
            margin-right: 10px;
            color: #6366f1; /* Accent color on expand */
        }

        #prompt-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0;
            max-width: 0;
            transition: opacity 0.2s ease, max-width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            color: #e2e8f0;
            font-size: 0.9rem;
            font-weight: 300;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            display: inline-block;
        }

        #prompt-toggle-btn.expanded #prompt-text {
            opacity: 1;
            max-width: 500px; /* Expands to show the prompt */
        }

        #chat-sidebar {
            position: absolute;
            right: 2rem;
            top: 2rem;
            bottom: 2rem;
            width: 320px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        /* Customize scrollbar */
        #chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        #chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .chat-message {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.75rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
            line-height: 1.4;
            color: #cbd5e1;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #chat-form {
            display: flex;
            padding: 1rem;
            border-top: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
            gap: 0.5rem;
        }

        #chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 0.5rem 1rem;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            outline: none;
            transition: all 0.2s ease;
            min-width: 0; /* fixes flex item stretching */
        }

        #chat-input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent-color);
        }

        #chat-form button {
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 20px;
            padding: 0.5rem 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Outfit', sans-serif;
        }

        #chat-form button:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }

        #doodle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: auto;
            cursor: crosshair;
        }

        #doodle-toolbar {
            position: absolute;
            top: 1rem;
            left: 1rem;
            z-index: 10;
            display: flex;
            gap: 0.5rem;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 0.5rem;
            border-radius: 15px;
            border: 1px solid var(--glass-border);
            align-items: center;
        }
        
        .color-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s;
        }
        
        .color-btn:hover {
            transform: scale(1.1);
        }
        
        .color-btn.active {
            border-color: var(--text-color);
        }
        
        .eraser-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
        }
        
        #brush-size {
            margin: 0 0.5rem;
            width: 80px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        #music-volume-slider {
            width: 70px;
            accent-color: var(--accent-color);
            cursor: pointer;
            height: 4px;
            border-radius: 2px;
            outline: none;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
            vertical-align: middle;
        }

        #music-volume-slider:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        #clear-doodle-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid var(--glass-border);
            padding: 0.25rem 0.75rem;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            margin-left: 0.5rem;
            transition: background 0.2s;
        }
        
        #clear-doodle-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

    </style>
</head>
<body>

    <div id="bg-layer"></div>

    <header>
        <div class="status-dot" id="status-indicator"></div>
        <h1>Narratron Canvas</h1>
        <!-- Role Indicator & Toggle -->
        <div id="role-container" style="margin-left: 2rem; display: flex; align-items: center; gap: 10px; border-left: 1px solid var(--glass-border); padding-left: 1rem;">
            <span id="role-badge" style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #a5b4fc; background: rgba(99, 102, 241, 0.2); padding: 4px 10px; border-radius: 12px; border: 1px solid rgba(99, 102, 241, 0.4);">Viewer</span>
            <button id="role-toggle-btn" style="background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); color: #fff; border-radius: 20px; padding: 4px 12px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; font-family: inherit;">Switch to Orator</button>
        </div>
        <!-- Music controls (visible to both roles) -->
        <div id="music-controls" style="margin-left: 1.5rem; display: flex; align-items: center; gap: 10px; border-left: 1px solid var(--glass-border); padding-left: 1.5rem;">
            <span id="music-status" style="font-size: 0.8rem; color: #a5b4fc; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">🎵 Silent</span>
            <button id="music-mute-btn" style="background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fff; border-radius: 20px; padding: 4px 12px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; font-family: inherit; display: flex; align-items: center; gap: 5px;">🔇 Unmute</button>
            <div id="volume-container" style="display: flex; align-items: center; gap: 8px;">
                <input type="range" id="music-volume-slider" min="0" max="1" step="0.01" value="0.5" title="Volume">
                <span id="volume-percent" style="font-size: 0.75rem; color: #a5b4fc; min-width: 32px;">50%</span>
            </div>
        </div>
        <!-- Orator Audio controls (hidden by default) -->
        <div id="orator-controls" style="display: none; align-items: center; gap: 10px; margin-left: 1.5rem; border-left: 1px solid var(--glass-border); padding-left: 1.5rem;">
            <button id="agent-connect-btn" style="background: #3b82f6; border: none; color: #fff; border-radius: 20px; padding: 6px 14px; font-size: 0.8rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.2s;">
                🔌 Connect Agent
            </button>
            <button id="agent-mic-btn" style="background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); color: #94a3b8; border-radius: 20px; padding: 6px 14px; font-size: 0.8rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.2s;" disabled>
                🎤 Mic Off
            </button>
        </div>
    </header>

    <div id="image-container">
        <div class="loader" id="loader"></div>
        <img id="current-image" src="" alt="Narratron Generation">
        <canvas id="doodle-canvas"></canvas>
        <div id="doodle-toolbar">
            <div class="color-btn" style="background: #ef4444;" data-color="#ef4444"></div>
            <div class="color-btn" style="background: #22c55e;" data-color="#22c55e"></div>
            <div class="color-btn active" style="background: #ffffff;" data-color="#ffffff"></div>
            <div class="color-btn" style="background: #3b82f6;" data-color="#3b82f6"></div>
            <div class="color-btn" style="background: #eab308;" data-color="#eab308"></div>
            <div class="color-btn eraser-btn" data-color="erase" title="Eraser">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"></path>
                    <path d="M22 21H7"></path>
                    <path d="m5 11 9 9"></path>
                </svg>
            </div>
            <input type="range" id="brush-size" min="1" max="40" value="3" title="Brush Size">
            <button id="clear-doodle-btn">Clear</button>
        </div>
        <div id="prompt-toggle-btn" title="View Prompt">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3Z"/>
            </svg>
            <span id="prompt-text"></span>
        </div>
    </div>

    <div id="chat-sidebar">
        <div id="chat-messages"></div>
        <form id="chat-form">
            <input type="text" id="chat-input" placeholder="Type an idea..." autocomplete="off" required>
            <button type="submit">Send</button>
        </form>
    </div>

    <script type="module">
        import { startAudioRecorderWorklet, stopMicrophone } from "/static/js/audio-recorder.js";

        let lastTime = 0;
        const currentImage = document.getElementById('current-image');
        const bgLayer = document.getElementById('bg-layer');
        const loader = document.getElementById('loader');
        const promptTextSpan = document.getElementById('prompt-text');
        const chatMessages = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        
        // Generate anonymous user ID
        const myUserId = "Viewer_" + Math.floor(Math.random() * 10000);
        const sessionId = "session-" + Math.random().toString(36).substring(7);

        // Music player controls and state
        let currentPlaylistTracks = [];
        let currentTrackIndex = 0;
        let bgMusic = new Audio();
        let isMuted = true;
        let lastPlaylistTime = 0;
        let activePlaylistName = null;

        const musicMuteBtn = document.getElementById('music-mute-btn');
        const musicStatusSpan = document.getElementById('music-status');
        const musicVolumeSlider = document.getElementById('music-volume-slider');
        const volumePercentSpan = document.getElementById('volume-percent');

        // Set initial volume and mute state
        bgMusic.volume = parseFloat(musicVolumeSlider.value);
        bgMusic.muted = isMuted;

        bgMusic.addEventListener('ended', () => {
            playNextTrack();
        });

        function playPlaylist(tracks) {
            console.log("Playing playlist tracks:", tracks);
            currentPlaylistTracks = tracks;
            currentTrackIndex = 0;
            if (currentPlaylistTracks.length > 0) {
                playTrack(currentPlaylistTracks[currentTrackIndex]);
            }
        }

        function playTrack(src) {
            console.log("Playing track:", src);
            bgMusic.src = src;
            bgMusic.muted = isMuted;
            bgMusic.volume = parseFloat(musicVolumeSlider.value);
            bgMusic.play().catch(err => {
                console.warn("Audio autoplay blocked/failed. User interaction may be required. Error:", err);
            });
        }

        function playNextTrack() {
            if (currentPlaylistTracks.length === 0) return;
            currentTrackIndex = (currentTrackIndex + 1) % currentPlaylistTracks.length;
            playTrack(currentPlaylistTracks[currentTrackIndex]);
        }

        function stopPlaylist() {
            console.log("Stopping playlist");
            bgMusic.pause();
            bgMusic.src = "";
            currentPlaylistTracks = [];
            currentTrackIndex = 0;
        }

        musicMuteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            bgMusic.muted = isMuted;
            if (isMuted) {
                musicMuteBtn.textContent = '🔇 Unmute';
                musicMuteBtn.style.background = 'rgba(239, 68, 68, 0.2)';
                musicMuteBtn.style.borderColor = 'rgba(239, 68, 68, 0.4)';
            } else {
                musicMuteBtn.textContent = '🔊 Mute';
                musicMuteBtn.style.background = 'rgba(255,255,255,0.08)';
                musicMuteBtn.style.borderColor = 'var(--glass-border)';
                // Try to play if it was blocked or paused
                if (bgMusic.paused && currentPlaylistTracks.length > 0) {
                    bgMusic.play().catch(() => {});
                }
            }
        });

        musicVolumeSlider.addEventListener('input', (e) => {
            const volume = parseFloat(e.target.value);
            bgMusic.volume = volume;
            volumePercentSpan.textContent = Math.round(volume * 100) + '%';
            
            if (volume > 0 && isMuted) {
                isMuted = false;
                bgMusic.muted = false;
                musicMuteBtn.textContent = '🔊 Mute';
                musicMuteBtn.style.background = 'rgba(255,255,255,0.08)';
                musicMuteBtn.style.borderColor = 'var(--glass-border)';
            }
        });
        
        const promptBtn = document.getElementById('prompt-toggle-btn');
        let promptPinned = false;

        promptBtn.addEventListener('mouseenter', () => {
            promptBtn.classList.add('expanded');
        });

        promptBtn.addEventListener('mouseleave', () => {
            if (!promptPinned) {
                promptBtn.classList.remove('expanded');
            }
        });

        promptBtn.addEventListener('click', () => {
            promptPinned = !promptPinned;
            if (!promptPinned) {
                promptBtn.classList.remove('expanded');
            } else {
                promptBtn.classList.add('expanded');
            }
        });

        async function fetchLatestImage() {
            try {
                const response = await fetch('/api/latest');
                const data = await response.json();
                
                // Process music payload
                if (data.music && data.music.time > lastPlaylistTime) {
                    lastPlaylistTime = data.music.time;
                    if (data.music.playlist) {
                        // Check if it's a new playlist
                        if (activePlaylistName !== data.music.playlist) {
                            activePlaylistName = data.music.playlist;
                            musicStatusSpan.textContent = '🎵 ' + data.music.playlist;
                            playPlaylist(data.music.tracks);
                        }
                        
                        // Process pause/resume state
                        if (data.music.paused) {
                            musicStatusSpan.textContent = '🎵 ' + data.music.playlist + ' (Paused)';
                            bgMusic.pause();
                        } else {
                            musicStatusSpan.textContent = '🎵 ' + data.music.playlist;
                            // If it was paused, resume it
                            if (bgMusic.paused && currentPlaylistTracks.length > 0) {
                                bgMusic.play().catch(err => console.warn(err));
                            }
                        }
                    } else {
                        activePlaylistName = null;
                        musicStatusSpan.textContent = '🎵 Silent';
                        stopPlaylist();
                    }
                }
                
                if (data.latest && data.time > lastTime) {
                    lastTime = data.time;
                    
                    const newImgUrl = data.latest + "?t=" + new Date().getTime();
                    const tempImage = new Image();
                    
                    tempImage.onload = () => {
                        loader.style.display = 'none';
                        currentImage.classList.remove('loaded');
                        promptBtn.classList.remove('expanded');
                        promptBtn.style.display = 'none';
                        promptPinned = false;
                        
                        setTimeout(() => {
                            currentImage.src = newImgUrl;
                            bgLayer.style.backgroundImage = `url(${newImgUrl})`;
                            currentImage.classList.add('loaded');
                            
                            if (data.prompt) {
                                promptTextSpan.textContent = data.prompt;
                                promptBtn.style.display = 'flex';
                            }
                        }, 500);
                    };
                    
                    tempImage.src = newImgUrl;
                }
            } catch (err) {
                console.error("Failed to fetch image data:", err);
            }
        }

        let lastMessageCount = 0;
        async function fetchChat() {
            try {
                const response = await fetch('/api/chat');
                const messages = await response.json();
                if (messages.length !== lastMessageCount) {
                    chatMessages.innerHTML = '';
                    messages.forEach(msg => {
                        const div = document.createElement('div');
                        div.className = 'chat-message';
                        div.textContent = msg.text;
                        chatMessages.appendChild(div);
                    });
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                    lastMessageCount = messages.length;
                }
            } catch (err) {
                console.error("Failed to fetch chat:", err);
            }
        }

        // Doodle Logic
        const canvas = document.getElementById('doodle-canvas');
        const ctx = canvas.getContext('2d');
        const colorBtns = document.querySelectorAll('.color-btn');
        const clearBtn = document.getElementById('clear-doodle-btn');
        const brushSizeSlider = document.getElementById('brush-size');

        let currentColor = '#ffffff';
        let currentBrushSize = 3;
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        
        brushSizeSlider.addEventListener('input', (e) => {
            currentBrushSize = parseInt(e.target.value);
        });

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        colorBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                colorBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentColor = btn.dataset.color;
            });
        });

        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws/doodle`);

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'clear') {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            } else if (data.type === 'draw') {
                const bSize = data.size || 3;
                drawLine(data.x0 * canvas.width, data.y0 * canvas.height, 
                         data.x1 * canvas.width, data.y1 * canvas.height, 
                         data.color, bSize, false);
            }
        };

        function drawLine(x0, y0, x1, y1, color, size, emit) {
            ctx.beginPath();
            if (color === 'erase') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.strokeStyle = 'rgba(0,0,0,1)';
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = color;
            }
            
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1);
            ctx.lineWidth = size;
            ctx.lineCap = 'round';
            ctx.stroke();
            ctx.closePath();
            
            ctx.globalCompositeOperation = 'source-over';

            if (!emit) return;
            
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'draw',
                    x0: x0 / canvas.width,
                    y0: y0 / canvas.height,
                    x1: x1 / canvas.width,
                    y1: y1 / canvas.height,
                    color: color,
                    size: size
                }));
            }
        }

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            lastX = e.offsetX;
            lastY = e.offsetY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            drawLine(lastX, lastY, e.offsetX, e.offsetY, currentColor, currentBrushSize, true);
            lastX = e.offsetX;
            lastY = e.offsetY;
        });

        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseout', () => isDrawing = false);

        clearBtn.addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'clear' }));
            }
        });

        let previousImgTime = lastTime;

        setInterval(() => {
            fetchLatestImage();
            if (lastTime > previousImgTime) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                previousImgTime = lastTime;
            }
        }, 1000);
        setInterval(fetchChat, 1000);
        fetchLatestImage();
        fetchChat();

        // ========================================
        // Orator vs Viewer Logic
        // ========================================
        const urlParams = new URLSearchParams(window.location.search);
        const isOrator = urlParams.get('role') === 'orator';

        const roleBadge = document.getElementById('role-badge');
        const roleToggleBtn = document.getElementById('role-toggle-btn');
        const oratorControls = document.getElementById('orator-controls');
        const agentConnectBtn = document.getElementById('agent-connect-btn');
        const agentMicBtn = document.getElementById('agent-mic-btn');
        const statusIndicator = document.getElementById('status-indicator');

        // State variables
        let agentWs = null;
        let audioRecorderNode = null;
        let audioRecorderContext = null;
        let micStream = null;
        let isRecording = false;

        // Initialize UI based on role
        if (isOrator) {
            roleBadge.textContent = 'Orator';
            roleBadge.style.color = '#f97316';
            roleBadge.style.background = 'rgba(249, 115, 22, 0.2)';
            roleBadge.style.borderColor = 'rgba(249, 115, 22, 0.4)';
            roleToggleBtn.textContent = 'Switch to Viewer';
            oratorControls.style.display = 'flex';
            statusIndicator.classList.add('disconnected'); // Start red
        } else {
            roleBadge.textContent = 'Viewer';
            roleToggleBtn.textContent = 'Switch to Orator';
            oratorControls.style.display = 'none';
            statusIndicator.classList.remove('disconnected'); // Viewer always green/default
        }

        roleToggleBtn.addEventListener('click', () => {
            if (isOrator) {
                window.location.search = '';
            } else {
                window.location.search = '?role=orator';
            }
        });

        // Chat submit forwarding to agent
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (!text) return;
            
            chatInput.value = '';
            try {
                // Post to chat_manager first
                await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ author: myUserId, text: text })
                });
                fetchChat();

                // Send to agent if connected
                if (isOrator && agentWs && agentWs.readyState === WebSocket.OPEN) {
                    agentWs.send(JSON.stringify({
                        type: "text",
                        text: text
                    }));
                }
            } catch (err) {
                console.error("Failed to send message:", err);
            }
        });

        // Audio Recorder Callback
        function audioRecorderHandler(pcmData) {
            if (agentWs && agentWs.readyState === WebSocket.OPEN && isRecording) {
                agentWs.send(pcmData);
            }
        }

        // Connect Agent WebSocket
        function connectAgent() {
            if (agentWs) return;

            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const agentWsUrl = `${wsProtocol}//${window.location.host}/ws/orator-${myUserId}/${sessionId}`;
            
            agentConnectBtn.textContent = 'Connecting...';
            agentConnectBtn.style.background = '#eab308'; // Amber

            agentWs = new WebSocket(agentWsUrl);

            agentWs.onopen = () => {
                console.log("Agent WebSocket connected.");
                agentConnectBtn.textContent = '🔌 Disconnect';
                agentConnectBtn.style.background = '#ef4444'; // Red
                agentMicBtn.disabled = false;
                agentMicBtn.style.color = '#fff';
                agentMicBtn.style.background = 'rgba(255,255,255,0.15)';
                statusIndicator.classList.remove('disconnected'); // Set back to green
            };

            agentWs.onclose = () => {
                console.log("Agent WebSocket disconnected.");
                cleanupAgentConnection();
            };

            agentWs.onerror = (err) => {
                console.error("Agent WebSocket error:", err);
                cleanupAgentConnection();
            };
        }

        // Disconnect and cleanup
        function cleanupAgentConnection() {
            if (isRecording) {
                stopMicStream();
            }
            if (agentWs) {
                try { agentWs.close(); } catch(e) {}
                agentWs = null;
            }
            agentConnectBtn.textContent = '🔌 Connect Agent';
            agentConnectBtn.style.background = '#3b82f6'; // Blue
            agentMicBtn.disabled = true;
            agentMicBtn.innerHTML = '🎤 Mic Off';
            agentMicBtn.style.color = '#94a3b8';
            agentMicBtn.style.background = 'rgba(255,255,255,0.08)';
            statusIndicator.classList.add('disconnected'); // Set back to red
        }

        // Start mic recording
        async function startMicStream() {
            try {
                const [node, context, stream] = await startAudioRecorderWorklet(audioRecorderHandler);
                audioRecorderNode = node;
                audioRecorderContext = context;
                micStream = stream;
                isRecording = true;
                
                agentMicBtn.innerHTML = '<span class="icon">🎙️</span> Mic Active';
                agentMicBtn.style.background = '#ef4444'; // Red
                agentMicBtn.style.color = '#fff';
                agentMicBtn.classList.add('recording-active');
            } catch (err) {
                console.error("Failed to start mic recording:", err);
                alert("Could not access microphone: " + err.message);
            }
        }

        // Stop mic recording
        function stopMicStream() {
            if (micStream) {
                stopMicrophone(micStream);
                micStream = null;
            }
            if (audioRecorderContext) {
                try { audioRecorderContext.close(); } catch(e) {}
                audioRecorderContext = null;
            }
            audioRecorderNode = null;
            isRecording = false;
            
            agentMicBtn.innerHTML = '<span class="icon">🎤</span> Mic Off';
            agentMicBtn.style.background = 'rgba(255,255,255,0.15)';
            agentMicBtn.style.color = '#fff';
            agentMicBtn.classList.remove('recording-active');
        }

        agentConnectBtn.addEventListener('click', () => {
            if (agentWs) {
                cleanupAgentConnection();
            } else {
                connectAgent();
            }
        });

        agentMicBtn.addEventListener('click', () => {
            if (isRecording) {
                stopMicStream();
            } else {
                startMicStream();
            }
        });
    </script>
</body>
</html>
