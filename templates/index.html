<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narratron Canvas</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1115;
            --text-color: #ffffff;
            --accent-color: #6366f1;
            --glass-bg: rgba(15, 17, 21, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            padding: 1.5rem;
            gap: 1.5rem;
            box-sizing: border-box;
        }

        /* The blurred background layer */
        #bg-layer {
            position: absolute;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            background-size: cover;
            background-position: center;
            filter: blur(20px) brightness(0.4);
            z-index: 0;
            transition: background-image 1s ease-in-out;
        }

        #main-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            flex: 1;
            height: 100%;
            gap: 1rem;
            min-width: 0;
        }

        /* Top Bar & Bottom Bar Styling */
        header {
            position: relative;
            z-index: 2;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            align-self: center;
            max-width: 100%;
        }

        #bottom-bar {
            position: relative;
            z-index: 2;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            align-self: center;
            max-width: 100%;
        }

        /* The main image container */
        #image-container {
            position: relative;
            z-index: 1;
            width: 100%;
            flex: 1;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
        }

        #current-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 2.5s ease-in-out;
        }

        #current-image.loaded {
            opacity: 1;
        }

        /* Ghost image used for crossfade: sits on top and fades out as current-image fades in */
        #ghost-image {
            position: absolute;
            inset: 0;
            max-width: 100%;
            max-height: 100%;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            pointer-events: none;
            z-index: 3;
            transition: opacity 2.5s ease-in-out;
        }

        #ghost-image.fading-out {
            opacity: 1;
            animation: ghost-fade-out 2.5s ease-in-out forwards;
        }

        @keyframes ghost-fade-out {
            from { opacity: 1; }
            to   { opacity: 0; }
        }

        /* --- Transition classes applied by JS: t-{transition} --- */

        /* crossfade: new image stays opaque underneath while ghost overlay fades out */
        #current-image.t-crossfade {
            opacity: 1;
            transition: none;
        }
        #current-image.t-crossfade.loaded {
            opacity: 1;
        }

        /* fade: simple fade in from black (no ghost needed) */
        #current-image.t-fade {
            opacity: 0;
            transition: opacity 1.8s ease-in-out;
        }
        #current-image.t-fade.loaded {
            opacity: 1;
        }

        /* none: instant display */
        #current-image.t-none {
            opacity: 0;
            transition: none;
        }
        #current-image.t-none.loaded {
            opacity: 1;
        }


        #doodle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: auto;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981, 0 0 20px #10b981;
            animation: pulse 2s infinite;
        }

        .status-dot.disconnected {
            background-color: #ef4444 !important;
            box-shadow: 0 0 10px #ef4444, 0 0 20px #ef4444 !important;
            animation: none !important;
        }

        @keyframes micPulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        
        .recording-active {
            animation: micPulse 1.5s infinite !important;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, #a5b4fc);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #prompt-toggle-btn {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 15;
            min-height: 44px;
            height: 44px;
            width: 44px;
            border-radius: 22px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0 11px;
            box-sizing: border-box;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            max-width: 44px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: none; /* Controlled by JS when prompt is available */
        }

        #prompt-toggle-btn svg {
            flex-shrink: 0;
            margin-right: 0px;
            transition: margin-right 0.3s ease;
            color: #a5b4fc;
            margin-top: 2px;
        }

        #prompt-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        #prompt-toggle-btn.expanded {
            width: auto;
            height: auto;
            max-width: 70%;
            max-height: 300px;
            border-radius: 16px;
            padding: 12px 16px 12px 12px;
            background: rgba(15, 17, 21, 0.9);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            align-items: flex-start;
            overflow-y: auto;
        }

        #prompt-toggle-btn.expanded::-webkit-scrollbar {
            width: 4px;
        }
        #prompt-toggle-btn.expanded::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        #prompt-toggle-btn.expanded svg {
            margin-right: 10px;
            color: #6366f1;
        }

        #prompt-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0;
            max-width: 0;
            transition: opacity 0.2s ease, max-width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            color: #e2e8f0;
            font-size: 0.9rem;
            font-weight: 300;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            display: inline-block;
        }

        #prompt-toggle-btn.expanded #prompt-text {
            opacity: 1;
            max-width: 100%;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.45;
        }

        #chat-sidebar {
            position: relative;
            width: 320px;
            height: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 10;
            flex-shrink: 0;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #chat-sidebar.collapsed {
            transform: translateX(120%);
            opacity: 0;
            margin-right: -320px;
            pointer-events: none;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
        }

        .panel-title {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #a5b4fc;
        }

        .panel-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .panel-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            color: #e2e8f0;
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: inherit;
        }

        .panel-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        /* --- Cinematic Fullscreen Mode --- */
        body.fullscreen-cinematic {
            padding: 0 !important;
            gap: 0 !important;
            background-color: #000000 !important;
        }

        body.fullscreen-cinematic #bg-layer {
            filter: blur(35px) brightness(0.2) !important;
        }

        body.fullscreen-cinematic #main-container {
            width: 100vw !important;
            height: 100vh !important;
            padding: 0 !important;
            gap: 0 !important;
            position: relative !important;
        }

        body.fullscreen-cinematic #image-container {
            border-radius: 0 !important;
            border: none !important;
            box-shadow: none !important;
            background: transparent !important;
            backdrop-filter: none !important;
            width: 100vw !important;
            height: 100vh !important;
            position: absolute !important;
            inset: 0 !important;
            z-index: 1 !important;
        }

        /* Floating UI overlay elements in cinematic fullscreen */
        body.fullscreen-cinematic header {
            position: absolute !important;
            top: 1.5rem !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            z-index: 100 !important;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        body.fullscreen-cinematic #bottom-bar {
            position: absolute !important;
            bottom: 1.5rem !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            z-index: 100 !important;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        body.fullscreen-cinematic #chat-sidebar {
            position: absolute !important;
            top: 1.5rem !important;
            right: 1.5rem !important;
            height: calc(100vh - 3rem) !important;
            z-index: 100 !important;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        body.fullscreen-cinematic #popout-expand-btn,
        body.fullscreen-cinematic #history-paging-controls {
            z-index: 101 !important;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        /* Reveal UI on mouseover / mouse move in cinematic fullscreen */
        body.fullscreen-cinematic.ui-visible header,
        body.fullscreen-cinematic.ui-visible #bottom-bar,
        body.fullscreen-cinematic.ui-visible #history-paging-controls,
        body.fullscreen-cinematic.ui-visible #chat-sidebar:not(.collapsed),
        body.fullscreen-cinematic.ui-visible #popout-expand-btn {
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        body.fullscreen-cinematic.ui-visible #chat-sidebar.collapsed {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        @keyframes pulseBadge {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.18); opacity: 0.85; }
            100% { transform: scale(1); opacity: 1; }
        }

        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        /* Customize scrollbar */
        #chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        #chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .chat-message {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.75rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
            line-height: 1.4;
            color: #cbd5e1;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #chat-form {
            display: flex;
            padding: 1rem;
            border-top: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
            gap: 0.5rem;
        }

        #chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 0.5rem 1rem;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            outline: none;
            transition: all 0.2s ease;
            min-width: 0; /* fixes flex item stretching */
        }

        #chat-input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent-color);
        }

        #chat-form button {
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 20px;
            padding: 0.5rem 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Outfit', sans-serif;
        }

        #chat-form button:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }

        #doodle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: auto;
            cursor: crosshair;
        }

        #doodle-toolbar {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        
        .color-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s;
        }
        
        .color-btn:hover {
            transform: scale(1.1);
        }
        
        .color-btn.active {
            border-color: var(--text-color);
        }
        
        .eraser-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
        }
        
        #brush-size {
            margin: 0 0.5rem;
            width: 80px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        #music-volume-slider {
            width: 70px;
            accent-color: var(--accent-color);
            cursor: pointer;
            height: 4px;
            border-radius: 2px;
            outline: none;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
            vertical-align: middle;
        }

        #music-volume-slider:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        #clear-doodle-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid var(--glass-border);
            padding: 0.25rem 0.75rem;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            margin-left: 0.5rem;
            transition: background 0.2s;
        }
        
        #clear-doodle-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .share-toast {
            position: fixed;
            top: 4.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(-10px) scale(0.9);
            background: rgba(15, 23, 42, 0.9);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .share-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
        }

    </style>
</head>
<body>

    <div id="bg-layer"></div>

    <div id="main-container">
        <header>
            <a id="back-btn" href="/" title="Back to Deployer" style="text-decoration: none; background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); color: #f8fafc; border-radius: 50%; width: 34px; height: 34px; font-size: 0.9rem; font-weight: 500; display: flex; align-items: center; justify-content: center; transition: all 0.2s; font-family: inherit; padding: 0;">
                ←
            </a>
            <div class="status-dot" id="status-indicator"></div>
            <h1>Narratron Canvas</h1>
            <button id="share-session-btn" title="Copy session share link" style="background: rgba(99, 102, 241, 0.2); border: 1px solid rgba(99, 102, 241, 0.4); color: #a5b4fc; border-radius: 50%; width: 34px; height: 34px; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; font-family: inherit; padding: 0;">
                🔗
            </button>
            <button id="save-session-btn" title="Save session to database" style="background: rgba(34, 197, 94, 0.2); border: 1px solid rgba(34, 197, 94, 0.4); color: #4ade80; border-radius: 50%; width: 34px; height: 34px; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; font-family: inherit; padding: 0;">
                💾
            </button>

            <!-- Full Screen & Pop-out Panel buttons -->
            <button id="fullscreen-btn" title="Full Screen (F11)" style="background: rgba(255, 255, 255, 0.08); border: 1px solid var(--glass-border); color: #f8fafc; border-radius: 50%; width: 34px; height: 34px; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; font-family: inherit; padding: 0;">
                <svg id="fullscreen-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                </svg>
            </button>
            <button id="popout-toggle-btn" title="Toggle Chat Sidebar" style="background: rgba(99, 102, 241, 0.2); border: 1px solid rgba(99, 102, 241, 0.4); color: #a5b4fc; border-radius: 20px; padding: 4px 12px; font-size: 0.8rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.2s; font-family: inherit;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
                    <line x1="15" x2="15" y1="3" y2="21"/>
                    <path d="m10 9 3 3-3 3"/>
                </svg>
                <span>Chat</span>
            </button>

            <!-- Orator Audio controls (Connect & Mic) -->
            <div id="orator-controls" style="display: none; align-items: center; gap: 10px; margin-left: 1rem; border-left: 1px solid var(--glass-border); padding-left: 1rem;">
                <button id="agent-connect-btn" style="background: #3b82f6; border: none; color: #fff; border-radius: 20px; padding: 6px 14px; font-size: 0.8rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.2s;">
                    🔌 Connect Agent
                </button>
                <button id="agent-mic-btn" style="background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); color: #94a3b8; border-radius: 20px; padding: 6px 14px; font-size: 0.8rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.2s;" disabled>
                    🎤 Mic Off
                </button>
                <button id="mic-hotkey-btn" title="Click to change mic hotkey" style="background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); color: #a5b4fc; border-radius: 20px; padding: 6px 14px; font-size: 0.8rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.2s;">
                    ⌨️ <span id="hotkey-display">Hotkey: M</span>
                </button>
            </div>

            <!-- Role Indicator & Toggle (Orator switch) -->
            <div id="role-container" style="margin-left: 1rem; display: flex; align-items: center; gap: 10px; border-left: 1px solid var(--glass-border); padding-left: 1rem;">
                <span id="role-badge" style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #a5b4fc; background: rgba(99, 102, 241, 0.2); padding: 4px 10px; border-radius: 12px; border: 1px solid rgba(99, 102, 241, 0.4);">Viewer</span>
                <button id="role-toggle-btn" style="background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); color: #fff; border-radius: 20px; padding: 4px 12px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; font-family: inherit;">Switch to Orator</button>
            </div>
        </header>

        <div id="image-container">

    <script type="module">
        import { startAudioRecorderWorklet, stopMicrophone } from "/static/js/audio-recorder.js";

        let lastTime = -1;
        let lastImageRawUrl = null;
        let isFirstCanvasLoad = true;
        const currentImage = document.getElementById('current-image');
        const bgLayer = document.getElementById('bg-layer');
        const promptTextSpan = document.getElementById('prompt-text');
        const chatMessages = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        
        // Generate anonymous user ID
        const myUserId = "Viewer_" + Math.floor(Math.random() * 10000);
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');
        if (!sessionId) {
            console.error("Session ID missing from URL parameters.");
            const container = document.getElementById('image-container');
            if (container) {
                container.innerHTML = `
                    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #f87171; text-align: center; padding: 2rem;">
                        <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem; font-weight: 600;">⚠️ No Active Session</h2>
                        <p style="color: #94a3b8; max-width: 400px; margin-bottom: 1.5rem; font-size: 0.95rem;">No session ID was specified in the URL. Please launch or join a session from the deployer page.</p>
                        <a href="/deploy" style="background: rgba(99, 102, 241, 0.2); border: 1px solid rgba(99, 102, 241, 0.4); color: #a5b4fc; padding: 0.6rem 1.2rem; border-radius: 20px; text-decoration: none; font-size: 0.9rem; transition: all 0.2s;">Go to Deployer Dashboard →</a>
                    </div>
                `;
            }
            throw new Error("Missing required session_id parameter in URL");
        }

        // Music player controls and state
        let currentPlaylistTracks = [];
        let currentTrackIndex = 0;
        let bgMusic = new Audio();
        let isMuted = false;
        let lastPlaylistTime = 0;
        let activePlaylistName = null;
        let fadeInterval = null;

        const musicMuteBtn = document.getElementById('music-mute-btn');
        const musicStatusSpan = document.getElementById('music-status');
        const musicVolumeSlider = document.getElementById('music-volume-slider');
        const volumePercentSpan = document.getElementById('volume-percent');

        // Set initial volume and mute state
        bgMusic.volume = parseFloat(musicVolumeSlider.value);
        bgMusic.muted = isMuted;

        bgMusic.addEventListener('ended', () => {
            playNextTrack();
        });

        function cancelFade() {
            if (fadeInterval) {
                clearInterval(fadeInterval);
                fadeInterval = null;
            }
        }

        function fadeIn(durationMs = 2000) {
            cancelFade();
            const targetVolume = parseFloat(musicVolumeSlider.value);
            if (isMuted || targetVolume === 0) {
                bgMusic.volume = targetVolume;
                return;
            }

            bgMusic.volume = 0;
            const startTime = Date.now();

            fadeInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(1, elapsed / durationMs);
                const currentTarget = parseFloat(musicVolumeSlider.value);
                bgMusic.volume = progress * currentTarget;

                if (progress >= 1) {
                    cancelFade();
                    bgMusic.volume = currentTarget;
                }
            }, 30);
        }

        function fadeOut(onComplete, durationMs = 800) {
            cancelFade();
            if (bgMusic.paused || bgMusic.volume === 0 || isMuted) {
                if (onComplete) onComplete();
                return;
            }

            const startVolume = bgMusic.volume;
            const startTime = Date.now();

            fadeInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(1, elapsed / durationMs);
                bgMusic.volume = Math.max(0, startVolume * (1 - progress));

                if (progress >= 1) {
                    cancelFade();
                    if (onComplete) onComplete();
                }
            }, 30);
        }

        function playPlaylist(tracks) {
            console.log("Playing playlist tracks:", tracks);
            currentPlaylistTracks = tracks;
            currentTrackIndex = 0;
            if (currentPlaylistTracks.length > 0) {
                playTrack(currentPlaylistTracks[currentTrackIndex]);
            }
        }

        function playTrack(src) {
            console.log("Playing track:", src);
            if (!bgMusic.paused && bgMusic.src) {
                fadeOut(() => {
                    startTrack(src);
                }, 500);
            } else {
                startTrack(src);
            }
        }

        function startTrack(src) {
            bgMusic.src = src;
            bgMusic.muted = isMuted;
            const targetVol = parseFloat(musicVolumeSlider.value);
            if (!isMuted && targetVol > 0) {
                bgMusic.volume = 0;
            } else {
                bgMusic.volume = targetVol;
            }
            bgMusic.play().then(() => {
                fadeIn(2000);
            }).catch(err => {
                console.warn("Audio autoplay blocked/failed. User interaction may be required. Error:", err);
            });
        }

        function playNextTrack() {
            if (currentPlaylistTracks.length === 0) return;
            currentTrackIndex = (currentTrackIndex + 1) % currentPlaylistTracks.length;
            playTrack(currentPlaylistTracks[currentTrackIndex]);
        }

        function stopPlaylist() {
            console.log("Stopping playlist");
            fadeOut(() => {
                bgMusic.pause();
                bgMusic.src = "";
                currentPlaylistTracks = [];
                currentTrackIndex = 0;
            }, 500);
        }

        musicMuteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            bgMusic.muted = isMuted;
            if (isMuted) {
                cancelFade();
                musicMuteBtn.textContent = '🔇 Unmute';
                musicMuteBtn.style.background = 'rgba(239, 68, 68, 0.2)';
                musicMuteBtn.style.borderColor = 'rgba(239, 68, 68, 0.4)';
            } else {
                musicMuteBtn.textContent = '🔊 Mute';
                musicMuteBtn.style.background = 'rgba(255,255,255,0.08)';
                musicMuteBtn.style.borderColor = 'var(--glass-border)';
                // Try to play if it was blocked or paused
                if (bgMusic.paused && currentPlaylistTracks.length > 0) {
                    bgMusic.volume = 0;
                    bgMusic.play().then(() => fadeIn(1500)).catch(() => {});
                } else {
                    fadeIn(1000);
                }
            }
        });

        musicVolumeSlider.addEventListener('input', (e) => {
            cancelFade();
            const volume = parseFloat(e.target.value);
            bgMusic.volume = volume;
            volumePercentSpan.textContent = Math.round(volume * 100) + '%';
            
            if (volume > 0 && isMuted) {
                isMuted = false;
                bgMusic.muted = false;
                musicMuteBtn.textContent = '🔊 Mute';
                musicMuteBtn.style.background = 'rgba(255,255,255,0.08)';
                musicMuteBtn.style.borderColor = 'var(--glass-border)';
            }
        });
        
        const promptBtn = document.getElementById('prompt-toggle-btn');
        let promptPinned = false;

        promptBtn.addEventListener('mouseenter', () => {
            promptBtn.classList.add('expanded');
        });

        promptBtn.addEventListener('mouseleave', () => {
            if (!promptPinned) {
                promptBtn.classList.remove('expanded');
            }
        });

        promptBtn.addEventListener('click', () => {
            promptPinned = !promptPinned;
            if (!promptPinned) {
                promptBtn.classList.remove('expanded');
            } else {
                promptBtn.classList.add('expanded');
            }
        });

        const currentSessionId = sessionId;

        const saveSessionBtn = document.getElementById('save-session-btn');
        if (saveSessionBtn) {
            saveSessionBtn.addEventListener('click', async () => {
                if (!currentSessionId) {
                    alert('No active session ID found to save.');
                    return;
                }
                const originalText = saveSessionBtn.innerHTML;
                saveSessionBtn.innerHTML = '⏳';
                saveSessionBtn.disabled = true;
                try {
                    const res = await fetch(`/api/sessions/${encodeURIComponent(currentSessionId)}/save`, {
                        method: 'POST'
                    });
                    const data = await res.json();
                    if (res.ok) {
                        saveSessionBtn.innerHTML = '✓';
                        setTimeout(() => {
                            saveSessionBtn.innerHTML = originalText;
                            saveSessionBtn.disabled = false;
                        }, 2000);
                    } else {
                        alert('Save failed: ' + (data.detail || 'Unknown error'));
                        saveSessionBtn.innerHTML = originalText;
                        saveSessionBtn.disabled = false;
                    }
                } catch (e) {
                    alert('Failed to save session: ' + e.message);
                    saveSessionBtn.innerHTML = originalText;
                    saveSessionBtn.disabled = false;
                }
            });
        }

        const ghostImage = document.getElementById('ghost-image');
        const rendererCanvas = document.getElementById('canvas-renderer');
        const renderCtx = rendererCanvas ? rendererCanvas.getContext('2d') : null;

        let currentLoadedImg = null;
        let activeAnimReq = null;

        function resizeRendererCanvas() {
            if (!rendererCanvas || !renderCtx) return;
            const container = rendererCanvas.parentElement;
            if (!container) return;
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;

            if (rendererCanvas.width !== Math.floor(rect.width * dpr) ||
                rendererCanvas.height !== Math.floor(rect.height * dpr)) {
                rendererCanvas.width = Math.floor(rect.width * dpr);
                rendererCanvas.height = Math.floor(rect.height * dpr);
            }

            renderCtx.setTransform(1, 0, 0, 1, 0, 0);
            renderCtx.scale(dpr, dpr);

            if (currentLoadedImg && !activeAnimReq) {
                drawSingleImage(currentLoadedImg);
            }
        }

        window.addEventListener('resize', resizeRendererCanvas);
        resizeRendererCanvas();

        function drawSingleImage(img) {
            if (!renderCtx || !rendererCanvas) return;
            const rect = rendererCanvas.getBoundingClientRect();
            const w = rect.width;
            const h = rect.height;
            renderCtx.clearRect(0, 0, w, h);
            if (img && img.complete && img.naturalWidth > 0) {
                drawContainImage(renderCtx, img, w, h, 1.0);
            }
        }

        function drawContainImage(ctx, img, containerW, containerH, opacity) {
            if (!img || !img.complete || img.naturalWidth === 0) return;
            const imgW = img.naturalWidth;
            const imgH = img.naturalHeight;
            const scale = Math.min(containerW / imgW, containerH / imgH);
            const drawW = imgW * scale;
            const drawH = imgH * scale;
            const x = (containerW - drawW) / 2;
            const y = (containerH - drawH) / 2;

            ctx.save();
            ctx.globalAlpha = opacity;
            ctx.drawImage(img, x, y, drawW, drawH);
            ctx.restore();
        }

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        async function applyImageTransition(newImgUrl, transition) {
            resizeRendererCanvas();

            const newImg = new Image();
            newImg.src = newImgUrl;

            try {
                await newImg.decode();
            } catch (e) {
                await new Promise((resolve) => {
                    newImg.onload = resolve;
                    newImg.onerror = resolve;
                });
            }

            // Sync hidden DOM images for backward-compatibility & test assertions
            if (currentImage) {
                currentImage.src = newImgUrl;
                currentImage.classList.add('t-crossfade', 'loaded');
            }

            if (activeAnimReq) {
                cancelAnimationFrame(activeAnimReq);
                activeAnimReq = null;
            }

            const rect = rendererCanvas.getBoundingClientRect();
            const containerW = rect.width;
            const containerH = rect.height;
            const oldImg = currentLoadedImg;
            const hasOldImage = oldImg && oldImg.complete && oldImg.naturalWidth > 0;

            if (transition === 'crossfade' && hasOldImage) {
                // --- PURE 2D CANVAS DISSOLVE CROSSFADE ---
                const duration = 2000; // 2 seconds
                const startTime = performance.now();

                const animate = (now) => {
                    const elapsed = now - startTime;
                    const progress = Math.min(1.0, elapsed / duration);
                    const easeProgress = easeInOutCubic(progress);

                    renderCtx.clearRect(0, 0, containerW, containerH);

                    // 1. Draw new image fully opaque underneath
                    drawContainImage(renderCtx, newImg, containerW, containerH, 1.0);

                    // 2. Draw old image dissolving on top (1 -> 0)
                    drawContainImage(renderCtx, oldImg, containerW, containerH, 1.0 - easeProgress);

                    if (progress < 1.0) {
                        activeAnimReq = requestAnimationFrame(animate);
                    } else {
                        activeAnimReq = null;
                        currentLoadedImg = newImg;
                    }
                };

                activeAnimReq = requestAnimationFrame(animate);

            } else if (transition === 'none') {
                // --- INSTANT DISPLAY ---
                drawSingleImage(newImg);
                currentLoadedImg = newImg;

            } else {
                // --- FADE IN FROM BLACK / FIRST REVEAL ---
                const duration = 1500;
                const startTime = performance.now();

                const animate = (now) => {
                    const elapsed = now - startTime;
                    const progress = Math.min(1.0, elapsed / duration);
                    const easeProgress = easeInOutCubic(progress);

                    renderCtx.clearRect(0, 0, containerW, containerH);
                    drawContainImage(renderCtx, newImg, containerW, containerH, easeProgress);

                    if (progress < 1.0) {
                        activeAnimReq = requestAnimationFrame(animate);
                    } else {
                        activeAnimReq = null;
                        currentLoadedImg = newImg;
                    }
                };

                activeAnimReq = requestAnimationFrame(animate);
            }

            bgLayer.style.backgroundImage = `url(${newImgUrl})`;
        }

        let imageHistory = [];
        let currentViewIndex = -1;
        let isPagedBack = false;
        let hasNewHeadWhilePagedBack = false;

        function updatePagingControlsUI() {
            const controls = document.getElementById('history-paging-controls');
            const prevBtn = document.getElementById('page-prev-btn');
            const nextBtn = document.getElementById('page-next-btn');
            const headBtn = document.getElementById('page-head-btn');
            const indicator = document.getElementById('page-indicator');
            const newBadge = document.getElementById('new-head-badge');
            const doodleCanvas = document.getElementById('doodle-canvas');

            if (!controls) return;

            if (!imageHistory || imageHistory.length <= 1) {
                controls.style.display = 'none';
                return;
            }

            controls.style.display = 'flex';

            const total = imageHistory.length;
            const currentNum = currentViewIndex >= 0 ? currentViewIndex + 1 : total;

            if (indicator) {
                indicator.textContent = isPagedBack ? `${currentNum} / ${total}` : `${currentNum} / ${total}`;
            }

            if (prevBtn) {
                prevBtn.disabled = (currentViewIndex <= 0);
                prevBtn.style.opacity = prevBtn.disabled ? '0.35' : '1';
                prevBtn.style.cursor = prevBtn.disabled ? 'default' : 'pointer';
            }

            if (nextBtn) {
                nextBtn.disabled = (currentViewIndex >= total - 1);
                nextBtn.style.opacity = nextBtn.disabled ? '0.35' : '1';
                nextBtn.style.cursor = nextBtn.disabled ? 'default' : 'pointer';
            }

            if (headBtn) {
                headBtn.style.display = isPagedBack ? 'flex' : 'none';
            }

            if (newBadge) {
                newBadge.style.display = hasNewHeadWhilePagedBack ? 'inline-block' : 'none';
            }

            if (doodleCanvas) {
                doodleCanvas.style.pointerEvents = isPagedBack ? 'none' : (doodlesEnabled ? 'auto' : 'none');
            }
        }

        function displayHistoryImage(index, transition = 'none') {
            if (index < 0 || index >= imageHistory.length) return;
            currentViewIndex = index;
            isPagedBack = (currentViewIndex < imageHistory.length - 1);
            if (!isPagedBack) {
                hasNewHeadWhilePagedBack = false;
            }

            const item = imageHistory[currentViewIndex];
            if (!item || !item.url) return;

            const imgUrl = item.url + (item.url.includes('?') ? '&' : '?') + 't=' + new Date().getTime();

            promptBtn.classList.remove('expanded');
            promptBtn.style.display = 'none';
            promptPinned = false;

            applyImageTransition(imgUrl, transition);

            if (item.prompt) {
                promptTextSpan.textContent = item.prompt;
                promptBtn.style.display = 'flex';
            } else {
                promptBtn.style.display = 'none';
            }

        async function fetchLatestImage() {
            try {
                const apiUrl = currentSessionId ? `/api/latest?session_id=${encodeURIComponent(currentSessionId)}` : '/api/latest';
                const response = await fetch(apiUrl);
                const data = await response.json();
                
                // Process music payload
                if (data.music && data.music.time > lastPlaylistTime) {
                    lastPlaylistTime = data.music.time;
                    if (data.music.playlist) {
                        // Check if it's a new playlist
                        if (activePlaylistName !== data.music.playlist) {
                            activePlaylistName = data.music.playlist;
                            musicStatusSpan.textContent = '\u{1F3B5} ' + data.music.playlist;
                            playPlaylist(data.music.tracks);
                        }
                        
                        // Process pause/resume state
                        if (data.music.paused) {
                            musicStatusSpan.textContent = '\u{1F3B5} ' + data.music.playlist + ' (Paused)';
                            if (!bgMusic.paused) {
                                fadeOut(() => bgMusic.pause(), 500);
                            }
                        } else {
                            musicStatusSpan.textContent = '\u{1F3B5} ' + data.music.playlist;
                            // If it was paused, resume it
                            if (bgMusic.paused && currentPlaylistTracks.length > 0) {
                                bgMusic.volume = 0;
                                bgMusic.play().then(() => fadeIn(1500)).catch(err => console.warn(err));
                            }
                        }
                    } else {
                        activePlaylistName = null;
                        musicStatusSpan.textContent = '\u{1F3B5} Silent';
                        stopPlaylist();
                    }
                }
                
                if (data.doodles_enabled !== undefined && data.doodles_enabled !== doodlesEnabled) {
                    setDoodlesDisplay(data.doodles_enabled);
                }

                if (data.history && Array.isArray(data.history) && data.history.length > 0) {
                    imageHistory = data.history;
                } else if (data.latest) {
                    imageHistory = [{
                        url: data.latest,
                        prompt: data.prompt || "",
                        time: data.time || 0,
                        transition: data.transition || "fade",
                        path: data.latest
                    }];
                }

                const isNewImage = (data.latest && (data.time > lastTime || data.latest !== lastImageRawUrl));
                if (isFirstCanvasLoad) {
                    isFirstCanvasLoad = false;
                    currentViewIndex = imageHistory.length - 1;
                    isPagedBack = false;
                    hasNewHeadWhilePagedBack = false;
                    if (data.latest) {
                        lastTime = data.time;
                        lastImageRawUrl = data.latest;
                        const newImgUrl = data.latest + "?t=" + new Date().getTime();
                        applyImageTransition(newImgUrl, 'none');
                        if (data.prompt) {
                            promptTextSpan.textContent = data.prompt;
                            promptBtn.style.display = 'flex';
                        }
                    }
                    updatePagingControlsUI();
                } else if (isNewImage) {
                    lastTime = data.time;
                    lastImageRawUrl = data.latest;
                    const newImgUrl = data.latest + "?t=" + new Date().getTime();
                    const transition = (data.transition || 'crossfade').toLowerCase().trim();

                    if (!isPagedBack) {
                        currentViewIndex = imageHistory.length - 1;
                        isPagedBack = false;
                        hasNewHeadWhilePagedBack = false;

                        // Clear doodles for new scene & play requested transition
                        doodleActions = [];
                        redrawAllDoodles();
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ type: 'clear' }));
                        }

                        const tempImage = new Image();
                        const triggerTransition = () => {
                            promptBtn.classList.remove('expanded');
                            promptBtn.style.display = 'none';
                            promptPinned = false;

                            applyImageTransition(newImgUrl, transition);

                            if (data.prompt) {
                                promptTextSpan.textContent = data.prompt;
                                promptBtn.style.display = 'flex';
                            }
                        };
                        
                        tempImage.onload = triggerTransition;
                        tempImage.onerror = triggerTransition;
                        tempImage.src = newImgUrl;
                    } else {
                        // User is paged back: Do not disrupt canvas view!
                        hasNewHeadWhilePagedBack = true;
                    }
                    updatePagingControlsUI();
                } else if (!data.latest && imageHistory.length === 0) {
                    // Maintain solid dark background when session has no images
                    bgLayer.style.backgroundImage = 'none';
                    if (currentImage) currentImage.classList.remove('loaded');
                    if (ghostImage) { ghostImage.src = ''; ghostImage.style.opacity = '0'; }
                    if (promptBtn) promptBtn.style.display = 'none';
                    updatePagingControlsUI();
                } else {
                    updatePagingControlsUI();
                }
            } catch (err) {
                console.error("Failed to fetch image data:", err);
            }
        }

        // Doodle Logic with Full HiDPI Persistence & Replay

        function resizeDoodleCanvas() {
            if (!canvas || !ctx) return;
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;

            if (canvas.width !== Math.floor(rect.width * dpr) || 
                canvas.height !== Math.floor(rect.height * dpr)) {
                canvas.width = Math.floor(rect.width * dpr);
                canvas.height = Math.floor(rect.height * dpr);
            }

            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
            redrawAllDoodles();
        }

        window.addEventListener('resize', resizeDoodleCanvas);

        function redrawAllDoodles() {
            if (!ctx || !canvas) return;
            const rect = canvas.getBoundingClientRect();
            const w = rect.width;
            const h = rect.height;

            ctx.clearRect(0, 0, w, h);

            doodleActions.forEach(action => {
                if (action.type === 'draw') {
                    renderSegment(
                        action.x0 * w, action.y0 * h,
                        action.x1 * w, action.y1 * h,
                        action.color, action.size || 3
                    );
                }
            });
        }

        function renderSegment(x0, y0, x1, y1, color, size) {
            ctx.save();
            ctx.beginPath();
            if (color === 'erase') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.strokeStyle = 'rgba(0,0,0,1)';
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = color;
            }
            
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1);
            ctx.lineWidth = size;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
            ctx.restore();
        }

        const ws = new WebSocket(wsUrl);

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'doodles_toggle') {
                setDoodlesDisplay(data.enabled);
            } else if (data.type === 'clear') {
                doodleActions = [];
                redrawAllDoodles();
            } else if (data.type === 'draw') {
                doodleActions.push(data);
                const rect = canvas.getBoundingClientRect();
                renderSegment(
                    data.x0 * rect.width, data.y0 * rect.height,
                    data.x1 * rect.width, data.y1 * rect.height,
                    data.color, data.size || 3
                );
            } else if (data.type === 'toggle_mic') {
                if (isOrator && agentWs && agentWs.readyState === WebSocket.OPEN && !agentMicBtn.disabled) {
                    agentMicBtn.click();

            }
        };

        function drawLine(nx0, ny0, nx1, ny1, color, size, emit) {
            const action = {
                type: 'draw',
                x0: nx0,
                y0: ny0,
                x1: nx1,
                y1: ny1,
                color: color,
                size: size
            };

            doodleActions.push(action);
            const rect = canvas.getBoundingClientRect();
            renderSegment(nx0 * rect.width, ny0 * rect.height, nx1 * rect.width, ny1 * rect.height, color, size);

            if (!emit) return;
            
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(action));
            }
        }

        function getNormalizedCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: Math.max(0, Math.min(1, (clientX - rect.left) / rect.width)),
                y: Math.max(0, Math.min(1, (clientY - rect.top) / rect.height))
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            if (!doodlesEnabled) return;
            isDrawing = true;
            const coords = getNormalizedCoords(e);
            lastNormX = coords.x;
            lastNormY = coords.y;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing || !doodlesEnabled) return;
            const coords = getNormalizedCoords(e);
            drawLine(lastNormX, lastNormY, coords.x, coords.y, currentColor, currentBrushSize, true);
            lastNormX = coords.x;
            lastNormY = coords.y;
        });

        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseout', () => isDrawing = false);

        canvas.addEventListener('touchstart', (e) => {
            if (!doodlesEnabled) return;
            e.preventDefault();
            isDrawing = true;
            const coords = getNormalizedCoords(e);
            lastNormX = coords.x;
            lastNormY = coords.y;
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDrawing || !doodlesEnabled) return;
            e.preventDefault();
            const coords = getNormalizedCoords(e);
            drawLine(lastNormX, lastNormY, coords.x, coords.y, currentColor, currentBrushSize, true);

        // ========================================

        let isRebindingHotkey = false;

        // Default hotkey: Ctrl + Shift + [
        let currentHotkey = {
            code: 'BracketLeft',
            key: '[',
            altKey: false,
            ctrlKey: true,
            shiftKey: true
        };

        // Load saved hotkey from localStorage or fetch server config
        try {
            const saved = localStorage.getItem('narratron_mic_hotkey');
            if (saved) {
                currentHotkey = JSON.parse(saved);
            } else {
                fetch('/api/orator/config')
                    .then(r => r.json())
                    .then(cfg => {
                        if (cfg && cfg.hotkey) {
                            const str = cfg.hotkey;
                            const ctrl = str.includes('<ctrl>') || str.toLowerCase().includes('ctrl');
                            const alt = str.includes('<alt>') || str.toLowerCase().includes('alt');
                            const shift = str.includes('<shift>') || str.toLowerCase().includes('shift');
                            let clean = str.replace(/<ctrl>|<shift>|<alt>|\+| /gi, '');
                            let code = clean;
                            let key = clean;
                            if (clean === '[') { code = 'BracketLeft'; key = '['; }
                            else if (clean === ']') { code = 'BracketRight'; key = ']'; }
                            else if (clean.length === 1 && clean.match(/[a-z]/i)) { code = 'Key' + clean.toUpperCase(); key = clean.toLowerCase(); }
                            else if (clean.length === 1 && clean.match(/[0-9]/)) { code = 'Digit' + clean; key = clean; }
                            currentHotkey = { code, key, altKey: alt, ctrlKey: ctrl, shiftKey: shift };
                            updateHotkeyUI();
                        }
                    }).catch(() => {});
            }

        function formatHotkeyLabel(hk) {
            let parts = [];
            if (hk.ctrlKey) parts.push('Ctrl');
            if (hk.altKey) parts.push('Alt');
            if (hk.shiftKey) parts.push('Shift');

            let codeLabel = hk.code || hk.key || '[';
            if (codeLabel.startsWith('Key')) {
                codeLabel = codeLabel.replace('Key', '');
            } else if (codeLabel.startsWith('Digit')) {
                codeLabel = codeLabel.replace('Digit', '');
            } else if (codeLabel === 'BracketLeft') {
                codeLabel = '[';
            } else if (codeLabel === 'BracketRight') {
                codeLabel = ']';
            } else if (codeLabel === 'Backquote') {
                codeLabel = '`';
            } else if (codeLabel === 'Semicolon') {
                codeLabel = ';';
            } else if (codeLabel === 'Quote') {
                codeLabel = "'";
            } else if (codeLabel === 'Comma') {
                codeLabel = ',';
            } else if (codeLabel === 'Period') {
                codeLabel = '.';
            } else if (codeLabel === 'Slash') {
                codeLabel = '/';
            } else if (codeLabel === 'Backslash') {
                codeLabel = '\\';
            } else if (codeLabel === 'Minus') {
                codeLabel = '-';
            } else if (codeLabel === 'Equal') {
                codeLabel = '=';
            } else if (codeLabel === 'Space') {
                codeLabel = 'Space';
            }
            parts.push(codeLabel.toUpperCase());
            return parts.join(' + ');
        }

        function updateHotkeyUI() {
            if (hotkeyDisplay) {
                hotkeyDisplay.textContent = `Hotkey: ${formatHotkeyLabel(currentHotkey)}`;
            }
        }

        updateHotkeyUI();

        // Rebind hotkey click handler
        if (micHotkeyBtn) {
            micHotkeyBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (isRebindingHotkey) return;
                
                isRebindingHotkey = true;
                micHotkeyBtn.style.background = '#eab308';
                micHotkeyBtn.style.color = '#000';
                hotkeyDisplay.textContent = 'Press any key...';
            });
        }

        // Global Keydown Listener for Hotkey
        window.addEventListener('keydown', (e) => {
            if (!isOrator) return;

            // Rebinding hotkey state
            if (isRebindingHotkey) {
                e.preventDefault();
                e.stopPropagation();

                // If user presses Escape, cancel rebinding
                if (e.code === 'Escape') {
                    isRebindingHotkey = false;
                    micHotkeyBtn.style.background = 'rgba(255,255,255,0.08)';
                    micHotkeyBtn.style.color = '#a5b4fc';
                    updateHotkeyUI();
                    return;
                }

                // Ignore standalone modifier keypresses
                if (['ControlLeft', 'ControlRight', 'AltLeft', 'AltRight', 'ShiftLeft', 'ShiftRight', 'MetaLeft', 'MetaRight'].includes(e.code)) {
                    return;
                }

                currentHotkey = {
                    code: e.code,
                    key: e.key,
                    altKey: e.altKey,
                    ctrlKey: e.ctrlKey,
                    shiftKey: e.shiftKey
                };

                try {
                    localStorage.setItem('narratron_mic_hotkey', JSON.stringify(currentHotkey));
                } catch(err) {}

                isRebindingHotkey = false;
                micHotkeyBtn.style.background = '#10b981';
                micHotkeyBtn.style.color = '#fff';
                updateHotkeyUI();

                setTimeout(() => {
                    micHotkeyBtn.style.background = 'rgba(255,255,255,0.08)';
                    micHotkeyBtn.style.color = '#a5b4fc';
                }, 600);
                return;
            }

            // Normal hotkey listening for toggling mic
            if (e.repeat) return;

            // Do not trigger hotkey if typing in input or textarea
            const activeEl = document.activeElement;
            if (activeEl && (['INPUT', 'TEXTAREA', 'SELECT'].includes(activeEl.tagName) || activeEl.isContentEditable)) {
                return;
            }

            // Match current hotkey
            const matchCode = e.code === currentHotkey.code;
            const matchAlt = !!e.altKey === !!currentHotkey.altKey;
            const matchCtrl = !!e.ctrlKey === !!currentHotkey.ctrlKey;
            const matchShift = !!e.shiftKey === !!currentHotkey.shiftKey;

            if (matchCode && matchAlt && matchCtrl && matchShift) {
                e.preventDefault();
                
                if (agentWs && agentWs.readyState === WebSocket.OPEN && !agentMicBtn.disabled) {
                    agentMicBtn.click();
                } else if (!agentWs || agentWs.readyState !== WebSocket.OPEN) {
                    console.log("[Hotkey] Cannot toggle mic: Agent not connected.");
                    agentConnectBtn.style.transform = 'scale(1.05)';
                    setTimeout(() => agentConnectBtn.style.transform = 'none', 200);
                }
            }
        });

        window.setMicHotkey = (code) => {
            currentHotkey = { code: code, key: code, altKey: false, ctrlKey: false, shiftKey: false };
            try { localStorage.setItem('narratron_mic_hotkey', JSON.stringify(currentHotkey)); } catch(e) {}
            updateHotkeyUI();
        };

        // Expose helper functions on window for automated evaluation
        window.enableAudioInput = () => {
            isRecording = true;
            agentMicBtn.innerHTML = '<span class="icon">🎙️</span> Mic Active';
            agentMicBtn.style.background = '#ef4444';
            agentMicBtn.classList.add('recording-active');
        };

        window.connectAgentAndMic = () => {
            connectAgent();
            const checkConnect = setInterval(() => {
                if (agentWs && agentWs.readyState === WebSocket.OPEN) {
                    window.enableAudioInput();
                    clearInterval(checkConnect);
                }
            }, 100);
        };

        window.sendOratorAudio = (base64Data) => {
            const ws = window.agentWs || agentWs;
            if (ws && ws.readyState === WebSocket.OPEN) {
                const binary = atob(base64Data);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                ws.send(bytes.buffer);
            } else {
                console.warn("[OratorAudio] WebSocket not ready. State:", ws ? ws.readyState : "null");
            }
        };

        window.streamFullAudio = async (fullBase64Data, chunkSize = 2048, delayMs = 64) => {
            const binary = atob(fullBase64Data);
            const totalBytes = binary.length;
            let offset = 0;
            const ws = window.agentWs || agentWs;
            
            return new Promise((resolve) => {
                const interval = setInterval(() => {
                    if (offset >= totalBytes) {
                        clearInterval(interval);
                        resolve();
                        return;
                    }
                    const end = Math.min(offset + chunkSize, totalBytes);
                    const chunk = new Uint8Array(end - offset);
                    for (let i = offset; i < end; i++) {
                        chunk[i - offset] = binary.charCodeAt(i);
                    }
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(chunk.buffer);
                    }
                    offset = end;
                }, delayMs);
            });
        };

        // ========================================
        // Full Screen & Pop-out Panel Controls
        // ========================================
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const fullscreenIcon = document.getElementById('fullscreen-icon');

        function isFullscreenActive() {
            return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
        }

        let mouseInactivityTimer = null;

        function showCinematicUI() {
            if (!document.body.classList.contains('fullscreen-cinematic')) return;
            document.body.classList.add('ui-visible');
            if (mouseInactivityTimer) clearTimeout(mouseInactivityTimer);
            mouseInactivityTimer = setTimeout(() => {
                document.body.classList.remove('ui-visible');
            }, 2500);
        }

        function handleCinematicMouseMove() {
            showCinematicUI();
        }

        function updateFullscreenUI() {
            const active = isFullscreenActive();
            if (fullscreenBtn) {
                fullscreenBtn.title = active ? "Exit Full Screen (Esc)" : "Full Screen (F11)";
            }
            if (fullscreenIcon) {
                if (active) {
                    fullscreenIcon.innerHTML = `<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>`;
                } else {
                    fullscreenIcon.innerHTML = `<path d="M8 3H5a2 2 0 0 1-2 2v3m18 0V5a2 2 0 0 1-2-2h-3m0 18h3a2 2 0 0 1 2-2v-3M3 16v3a2 2 0 0 1 2 2h3"/>`;
                }
            }

            if (active) {
                document.body.classList.add('fullscreen-cinematic');
                window.addEventListener('mousemove', handleCinematicMouseMove);
                showCinematicUI();
            } else {
                document.body.classList.remove('fullscreen-cinematic', 'ui-visible');
                window.removeEventListener('mousemove', handleCinematicMouseMove);
                if (mouseInactivityTimer) {
                    clearTimeout(mouseInactivityTimer);
                    mouseInactivityTimer = null;
                }
            }

            setTimeout(() => {
                resizeRendererCanvas();
                resizeDoodleCanvas();
            }, 100);
        }

        function toggleFullScreen() {
            if (!isFullscreenActive()) {
                const docEl = document.documentElement;
                if (docEl.requestFullscreen) docEl.requestFullscreen();
                else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
                else if (docEl.mozRequestFullScreen) docEl.mozRequestFullScreen();
                else if (docEl.msRequestFullscreen) docEl.msRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
            }
        }

        if (fullscreenBtn) {
            fullscreenBtn.addEventListener('click', toggleFullScreen);
        }

        ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(evt => {
            document.addEventListener(evt, updateFullscreenUI);
        });

        // Pop-out Panel drawer & standalone window logic
        const popoutToggleBtn = document.getElementById('popout-toggle-btn');
        const popoutCollapseBtn = document.getElementById('popout-collapse-btn');
        const popoutExpandBtn = document.getElementById('popout-expand-btn');
        const popoutWindowBtn = document.getElementById('popout-window-btn');
        const poppedOutPlaceholder = document.getElementById('popped-out-placeholder');
        const panelBody = document.getElementById('panel-body');
        const dockPanelBtn = document.getElementById('dock-panel-btn');

        let isPanelCollapsed = false;
        let popoutWindowRef = null;
        const popoutBroadcast = new BroadcastChannel('narratron_popout_channel');

        function setPanelCollapsed(collapsed) {
            isPanelCollapsed = collapsed;
            const sidebar = document.getElementById('chat-sidebar');
            if (sidebar) {
                if (collapsed) {
                    sidebar.classList.add('collapsed');
                } else {
                    sidebar.classList.remove('collapsed');
                }
            }
            if (popoutExpandBtn) {
                popoutExpandBtn.style.display = collapsed ? 'flex' : 'none';
            }
            setTimeout(() => {
                resizeRendererCanvas();
                resizeDoodleCanvas();
            }, 360);
        }

        if (popoutToggleBtn) {
            popoutToggleBtn.addEventListener('click', () => setPanelCollapsed(!isPanelCollapsed));
        }
        if (popoutCollapseBtn) {
            popoutCollapseBtn.addEventListener('click', () => setPanelCollapsed(true));
        }
        if (popoutExpandBtn) {
            popoutExpandBtn.addEventListener('click', () => setPanelCollapsed(false));
        }

        function openPopoutWindow() {
            const width = 400;
            const height = 680;
            const left = window.screen.width - width - 50;
            const top = 100;
            
            const url = `/popout?session_id=${encodeURIComponent(sessionId)}&role=${isOrator ? 'orator' : 'viewer'}`;
            popoutWindowRef = window.open(url, 'NarratronPopoutPanel', `width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=yes`);
            
            if (popoutWindowRef) {
                if (panelBody) panelBody.style.display = 'none';
                if (poppedOutPlaceholder) poppedOutPlaceholder.style.display = 'flex';
            }
        }

        function dockPanelBack() {
            if (popoutWindowRef && !popoutWindowRef.closed) {
                popoutWindowRef.close();
            }
            popoutWindowRef = null;
            if (panelBody) panelBody.style.display = 'flex';
            if (poppedOutPlaceholder) poppedOutPlaceholder.style.display = 'none';
        }

        if (popoutWindowBtn) popoutWindowBtn.addEventListener('click', openPopoutWindow);
        if (dockPanelBtn) dockPanelBtn.addEventListener('click', dockPanelBack);

        popoutBroadcast.onmessage = (event) => {
            if (event.data.type === 'dock_panel' || event.data.type === 'popout_closed') {
                dockPanelBack();
            } else if (event.data.type === 'chat_sent') {
                fetchChat();
            }
        };

        window.toggleFullScreen = toggleFullScreen;
        window.togglePopoutPanel = () => setPanelCollapsed(!isPanelCollapsed);
        window.openPopoutWindow = openPopoutWindow;
        window.dockPanelBack = dockPanelBack;
    </script>
</body>
