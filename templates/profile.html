<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Narratron - Profile</title><link rel="icon" href="/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr@1.9.1/dist/themes/monolith.min.css"><link rel="stylesheet" href="/static/css/auth-flow.css">
  <script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr@1.9.1/dist/pickr.min.js"></script><script type="module" src="/static/generated/canvas/auth-flow.js"></script>
  <style>
    :root{--bg:#0b0d12;--surface:rgba(20,25,36,.84);--surface-muted:rgba(255,255,255,.045);--border:rgba(255,255,255,.1);--text:#f8fafc;--muted:#94a3b8;--accent:#818cf8}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Outfit,sans-serif;color:var(--text);background:radial-gradient(circle at 18% 9%,rgba(99,102,241,.2),transparent 32%),radial-gradient(circle at 88% 26%,rgba(14,165,233,.08),transparent 28%),var(--bg)}main{max-width:1100px;margin:3.5rem auto;padding:0 1.25rem}.profile-shell{display:grid;grid-template-columns:255px minmax(0,1fr);gap:1.25rem;align-items:start}.profile-sidebar,.panel{background:var(--surface);border:1px solid var(--border);box-shadow:0 20px 60px rgba(0,0,0,.2);backdrop-filter:blur(16px)}.profile-sidebar{border-radius:18px;padding:1.25rem;position:sticky;top:1.25rem}.identity{display:flex;gap:.85rem;align-items:center;padding:.35rem .3rem 1.3rem;margin-bottom:.9rem;border-bottom:1px solid var(--border)}.avatar{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,var(--accent),#38bdf8);color:#fff;font-size:1.1rem;font-weight:700}.identity h1{font-size:1.2rem;margin:0;overflow-wrap:anywhere}.identity p{margin:.15rem 0 0;color:var(--muted);font-size:.8rem}.tab-list{display:grid;gap:.35rem}.tab-button{width:100%;display:flex;align-items:center;gap:.75rem;border:1px solid transparent;border-radius:10px;padding:.7rem .75rem;background:transparent;color:var(--muted);font:inherit;text-align:left;cursor:pointer;transition:.16s ease}.tab-button:hover{color:var(--text);background:rgba(255,255,255,.06)}.tab-button.active{color:#fff;background:rgba(129,140,248,.18);border-color:rgba(129,140,248,.35)}.tab-icon{width:1.25rem;text-align:center;font-size:1rem}.tab-label{font-weight:500}.tab-note{margin-left:auto;color:#a5b4fc;font-size:.75rem}.tab-divider{height:1px;background:var(--border);margin:.65rem .3rem}.tab-button.danger{color:#fca5a5}.tab-button.danger.active{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.28)}.panel{min-height:500px;border-radius:18px;padding:2rem}.panel-header{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;padding-bottom:1.4rem;margin-bottom:1.6rem;border-bottom:1px solid var(--border)}.eyebrow{margin:0 0 .35rem;color:#a5b4fc;text-transform:uppercase;letter-spacing:.11em;font-size:.72rem;font-weight:700}.panel h2{font-size:1.6rem;margin:0}.panel-subtitle{margin:.4rem 0 0;color:var(--muted);line-height:1.45}.tab-panel{display:none}.tab-panel.active{display:block}.bio-heading{display:flex;align-items:center;justify-content:space-between;gap:1rem}.bio-heading .section-label{margin-bottom:.7rem}.bio-copy{margin:0;line-height:1.65;white-space:pre-wrap}.bio-edit-btn{padding:.4rem .7rem;background:transparent;border:1px solid rgba(129,140,248,.45);color:#c7d2fe;font-size:.82rem}.bio-edit-actions{display:flex;align-items:center;gap:.6rem;margin-top:.75rem}.bio-cancel-btn{background:rgba(255,255,255,.08);border:1px solid var(--border);color:var(--text)}.empty,.private{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.85rem}.stat{padding:1.15rem;border-radius:12px;background:var(--surface-muted);border:1px solid var(--border)}.stat b{display:block;font-size:1.55rem}.stat span,label{color:var(--muted);font-size:.88rem}.section-label{font-size:.78rem;margin:1.75rem 0 .7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:600}textarea,input[type="text"],input[type="number"]{width:100%;padding:.8rem;color:var(--text);background:#10131c;border:1px solid var(--border);border-radius:10px;font:inherit}textarea:focus,input:focus{outline:2px solid rgba(129,140,248,.5);border-color:transparent}textarea{min-height:150px;resize:vertical}label{display:flex;gap:.55rem;align-items:center;margin:1rem 0}button{border:0;border-radius:9px;padding:.7rem 1rem;font:inherit;font-weight:600;color:#fff;background:#6366f1;cursor:pointer;transition:all .15s ease}button:hover{filter:brightness(1.12)}button:disabled{opacity:.5;cursor:not-allowed}#status{margin-left:.75rem;color:#86efac}.action-row{display:flex;align-items:center;margin-top:1rem}.gift-box,.stamp-upload-box,.danger-box{padding:1.25rem;border:1px solid rgba(129,140,248,.3);border-radius:12px;background:rgba(99,102,241,.07)}.gift-box p{margin:.4rem 0 1rem;color:var(--muted);font-size:.9rem}.gift-row{display:flex;gap:.75rem;align-items:center}.gift-row input{max-width:180px}.gift-link{margin-top:.85rem;color:#a5b4fc;word-break:break-all;font-size:.9rem}.stamps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.85rem}.stamp-card{position:relative;background:var(--surface-muted);border:1px solid var(--border);border-radius:12px;padding:.75rem;display:flex;flex-direction:column;align-items:center;text-align:center;transition:transform .18s ease,border-color .18s ease}.stamp-card:hover{transform:translateY(-2px);border-color:rgba(129,140,248,.45)}.stamp-thumb-wrap{width:80px;height:80px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25);border-radius:9px;overflow:hidden;margin-bottom:.55rem}.stamp-thumb{max-width:100%;max-height:100%;object-fit:contain}.stamp-title{font-size:.82rem;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;margin-bottom:.5rem}.stamp-delete-btn{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.3);border-radius:6px;padding:.3rem .55rem;font-size:.75rem;width:100%}.stamp-upload-form{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;margin-top:.75rem}.stamp-upload-form input[type="file"]{display:none}.stamp-file-label{display:inline-flex;align-items:center;gap:.5rem;padding:.6rem .9rem;background:rgba(255,255,255,.08);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:.85rem;color:var(--text);margin:0}.stamp-file-name{font-size:.82rem;color:var(--muted);max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.danger-box{border-color:rgba(239,68,68,.28);background:rgba(239,68,68,.07)}.danger-btn{background:transparent;color:#f87171;border:1px solid rgba(239,68,68,.45)}.danger-confirm-btn{background:#dc2626}.cancel-btn{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--border);margin-right:.75rem}@media(max-width:760px){main{margin:1.5rem auto}.profile-shell{grid-template-columns:1fr}.profile-sidebar{position:static;padding:.8rem}.identity{padding:.35rem .4rem .9rem;margin-bottom:.5rem}.tab-list{display:flex;overflow-x:auto;gap:.4rem;padding-bottom:.15rem}.tab-divider{display:none}.tab-button{flex:0 0 auto;width:auto;padding:.6rem .7rem}.tab-note{display:none}.panel{min-height:0;padding:1.25rem}.panel-header{margin-bottom:1.25rem;padding-bottom:1rem}.panel h2{font-size:1.35rem}.stats{grid-template-columns:1fr}.gift-row{align-items:stretch;flex-direction:column}.gift-row input{max-width:none}.stamp-upload-form>*{max-width:100%!important}.action-row{flex-wrap:wrap;gap:.6rem}.action-row #status{margin-left:0}}
    .profile-shell > * { min-width: 0; }
    .stamp-expand-summary { cursor: pointer; font-size: .9rem; font-weight: 600; color: #c7d2fe; }
    .stamp-expand-summary:focus-visible { outline: 2px solid #818cf8; outline-offset: 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <!-- SHARED_TOPBAR -->
  <main><div id="profile"><p class="empty">Loading profile…</p></div></main>
  <script type="module" src="/static/generated/canvas/profile.js"></script>
</body>
</html>
