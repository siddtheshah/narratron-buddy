<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narratron OBS Canvas</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/image-effects.css?v=effects-20260811-2">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000000;
            font-family: 'Outfit', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Main OBS Viewport Container */
        #image-container {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 1;
        }

        /* High Performance Renderer Canvas */
        #canvas-renderer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Doodle Drawing Overlay Canvas */
        #doodle-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        /* Hidden DOM elements for compatibility & image preloading */
        #current-image,
        #ghost-image {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }

        #image-container .canvas-image-effect-frame {
            position: absolute;
            z-index: 2;
            pointer-events: none;
            background: transparent;
        }

        #image-container .canvas-image-effect-frame .image-effect-source {
            width: 100%;
            height: 100%;
            object-fit: fill;
            opacity: 1;
        }

        #scene-dialogue-overlay { position: absolute; right: 0; bottom: clamp(1.25rem,5vh,3.5rem); left: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; gap: .3rem; padding: 0 6%; box-sizing: border-box; pointer-events: none; }
        .scene-dialogue-bubble { max-width: min(88vw,900px); color: #fff; font-size: clamp(1.05rem,2.1vw,1.65rem); font-weight: 600; line-height: 1.25; text-align: center; text-shadow: 0 2px 5px rgba(0,0,0,.95), 0 0 12px rgba(0,0,0,.7); }
        .scene-dialogue-bubble.thought { font-style: italic; }
        .scene-dialogue-speaker { color: inherit; font-size: .78em; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; margin-right: .4em; }
    </style>
</head>

<body>

    <div id="image-container">
        <canvas id="canvas-renderer"></canvas>
        <img id="current-image" src="" alt="Narratron Generation">
        <img id="ghost-image" src="" alt="" aria-hidden="true">
        <canvas id="doodle-canvas"></canvas>
        <div id="scene-dialogue-overlay" aria-live="polite"></div>
    </div>

    <script type="module">
        import { createDoodleRenderer, createImageRenderer } from "/static/js/canvas-renderers.js?v=triframe-20260812-1";
        // Extract Theater ID from URL parameters or Path
        const urlParams = new URLSearchParams(window.location.search);
        let currenttheaterId = urlParams.get('theater_id') || '';
        if (!currenttheaterId) {
            const pathParts = window.location.pathname.split('/');
            if (pathParts.length > 2 && pathParts[1] === 'obs') {
                currenttheaterId = decodeURIComponent(pathParts[2]);
            }
        }

        const rendererCanvas = document.getElementById('canvas-renderer');
        const doodleCanvas = document.getElementById('doodle-canvas');
        const currentImage = document.getElementById('current-image');
        const sceneDialogueOverlay = document.getElementById('scene-dialogue-overlay');
        let sceneDialogueSignature = '';
        let sceneDialogueRenderId = 0;
        const dialogueSpeakerColors = new Map();
        const dialogueSpeakerPalette = ['#fbbf24', '#67e8f9', '#f9a8d4', '#a7f3d0', '#c4b5fd', '#fdba74', '#93c5fd', '#f0abfc'];
        const sceneSpeechQueue = [];
        let sceneSpeechPlaying = false;
        let currentSceneAudio = null;

        function stopSceneSpeech() {
            sceneSpeechQueue.length = 0;
            sceneSpeechPlaying = false;
            if (currentSceneAudio) {
                const audio = currentSceneAudio;
                currentSceneAudio = null;
                audio.onended = null;
                audio.onerror = null;
                try {
                    audio.pause();
                    audio.src = '';
                } catch (_) {}
            }
        }

        function enqueueSceneSpeech(audioUrl) {
            if (!audioEnabled || !audioUrl) return;
            sceneSpeechQueue.push(audioUrl);
            if (sceneSpeechPlaying) return;
            const playNext = () => {
                const next = sceneSpeechQueue.shift();
                if (!next) {
                    sceneSpeechPlaying = false;
                    currentSceneAudio = null;
                    return;
                }
                sceneSpeechPlaying = true;
                const audio = new Audio(next);
                currentSceneAudio = audio;
                audio.onended = audio.onerror = () => {
                    if (currentSceneAudio === audio) {
                        currentSceneAudio = null;
                    }
                    playNext();
                };
                audio.play().catch(() => {
                    if (currentSceneAudio === audio) {
                        currentSceneAudio = null;
                    }
                    playNext();
                });
            };
            playNext();
        }

        function getDialogueSpeakerColor(speaker) {
            if (!dialogueSpeakerColors.has(speaker)) {
                dialogueSpeakerColors.set(speaker, dialogueSpeakerPalette[dialogueSpeakerColors.size % dialogueSpeakerPalette.length]);
            }
            return dialogueSpeakerColors.get(speaker);
        }
        let lastTime = 0;
        let lastImageRawUrl = "";
        let lastImageEffect = null;
        let isFirstCanvasLoad = true;
        let lastAnimationSignature = '';
        let doodleActions = [];
        let doodlesEnabled = true;
        // OBS Browser Sources capture audio produced by this page. Keep this
        // player deliberately headless so the visual output remains clean.
        const audioEnabled = urlParams.get('audio') !== '0';
        const requestedVolume = Number(urlParams.get('audio_volume'));
        const musicVolume = Number.isFinite(requestedVolume)
            ? Math.min(1, Math.max(0, requestedVolume))
            : 0.8;
        const bgMusic = new Audio();
        bgMusic.volume = musicVolume;
        let activePlaylistName = null;
        let activeTracks = [];
        let activeTrackSrc = null;
        let lastMusicTime = 0;
        let hasReceivedMusicState = false;
        let latestMusicState = null;
        let overlayAudioPaused = false;

        bgMusic.addEventListener('ended', () => playNextTrack());

        function chooseTrack(tracks) {
            if (tracks.length === 1) return tracks[0];
            const alternatives = tracks.filter(track => track !== activeTrackSrc);
            return alternatives[Math.floor(Math.random() * alternatives.length)];
        }

        function playNextTrack() {
            if (!audioEnabled || activeTracks.length === 0) return;
            const track = chooseTrack(activeTracks);
            activeTrackSrc = track;
            bgMusic.src = track;
            bgMusic.play().catch((error) => {
                console.warn('OBS music playback could not start:', error);
            });
        }

        function syncMusic(music) {
            latestMusicState = music;
            if (!audioEnabled || overlayAudioPaused) return;

            const playlist = music?.playlist;
            const tracks = Array.isArray(music?.tracks) ? music.tracks : [];
            if (!playlist || tracks.length === 0) {
                activePlaylistName = null;
                activeTracks = [];
                activeTrackSrc = null;
                bgMusic.pause();
                bgMusic.removeAttribute('src');
                return;
            }

            const playlistChanged = playlist !== activePlaylistName;
            activePlaylistName = playlist;
            activeTracks = tracks;
            if (playlistChanged || !activeTrackSrc || !tracks.includes(activeTrackSrc)) {
                playNextTrack();
            }

            if (music.paused) {
                bgMusic.pause();
            } else if (bgMusic.paused) {
                bgMusic.play().catch((error) => {
                    console.warn('OBS music playback could not resume:', error);
                });
            }
        }

        // There is deliberately no player UI in the OBS view. A normal web
        // browser may still require a user activation before it permits audio;
        // a click anywhere on the canvas retries the already-selected track.
        // OBS Browser Source normally permits autoplay and needs no click.
        document.addEventListener('pointerdown', () => {
            if (latestMusicState) syncMusic(latestMusicState);
        });

        // When embedded by Foundry, the iframe receives keyboard focus and
        // its events cannot bubble to the host. Relay the module's close
        // shortcut back to the parent without affecting standalone OBS use.
        window.addEventListener('keydown', (event) => {
            if (event.altKey && event.code === 'KeyO' && window.parent !== window) {
                event.preventDefault();
                window.parent.postMessage({
                    source: 'narratron-buddy-obs',
                    action: 'hide-overlay',
                }, '*');
            }
        });

        window.addEventListener('message', (event) => {
            if (event.data?.source !== 'narratron-buddy-foundry') return;

            if (event.data.action === 'pause-audio') {
                overlayAudioPaused = true;
                bgMusic.pause();
            } else if (event.data.action === 'resume-audio') {
                overlayAudioPaused = false;
                if (latestMusicState) syncMusic(latestMusicState);
            }
        });

        const imageRenderer = createImageRenderer({
            canvas: rendererCanvas,
            image: currentImage,
            fadeDuration: 1200,
            fitMode: "cover",
        });
        const doodleRenderer = createDoodleRenderer({
            canvas: doodleCanvas,
            isVisible: () => doodlesEnabled,
        });
        const resizeRendererCanvas = imageRenderer.resize;
        const applyImageTransition = imageRenderer.applyTransition;
        const playImageSequence = imageRenderer.playSequence;
        const resizeDoodleCanvas = () => doodleRenderer.resize(doodleActions);
        const redrawAllDoodles = () => doodleRenderer.redraw(doodleActions);
        const renderSegment = doodleRenderer.renderSegment;

        function updateSceneDialogue(dialogue) {
            const lines = (Array.isArray(dialogue) ? dialogue : [])
                .filter(item => item && item.text)
                .map(item => ({
                    speaker: String(item.speaker || 'Narrator'),
                    text: String(item.text),
                    kind: item.kind === 'thought' ? 'thought' : 'speech',
                }));
            const signature = JSON.stringify(lines);
            if (signature === sceneDialogueSignature) return;
            sceneDialogueSignature = signature;
            stopSceneSpeech();
            const renderId = ++sceneDialogueRenderId;
            sceneDialogueOverlay.replaceChildren();
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            (async () => {
                for (const item of lines) {
                    if (renderId !== sceneDialogueRenderId) return;
                    const bubble = document.createElement('div');
                    bubble.className = `scene-dialogue-bubble ${item.kind}`;
                    const speaker = document.createElement('span');
                    speaker.className = 'scene-dialogue-speaker';
                    speaker.textContent = item.speaker;
                    speaker.style.color = getDialogueSpeakerColor(item.speaker);
                    const text = document.createElement('span');
                    bubble.append(speaker, text);
                    sceneDialogueOverlay.appendChild(bubble);

                    if (reduceMotion) {
                        text.textContent = item.text;
                        continue;
                    }
                    const characters = Array.from(item.text);
                    const wordCount = item.text.trim().split(/\s+/).filter(Boolean).length;
                    const delay = Math.round((wordCount * 1000) / (4.5 * Math.max(characters.length, 1)));
                    for (const character of characters) {
                        if (renderId !== sceneDialogueRenderId) return;
                        text.textContent += character;
                        await new Promise(resolve => window.setTimeout(resolve, delay));
                    }
                }
            })();
        }

        window.addEventListener('resize', () => {
            resizeRendererCanvas();
            resizeDoodleCanvas();
        });

        async function fetchLatestImage() {
            try {
                const apiUrl = currenttheaterId ? `/api/latest?theater_id=${encodeURIComponent(currenttheaterId)}` : '/api/latest';
                const response = await fetch(apiUrl);
                const data = await response.json();
                updateSceneDialogue(data.scene_dialogue);

                if (data.music && (!hasReceivedMusicState || data.music.time > lastMusicTime)) {
                    lastMusicTime = data.music.time;
                    hasReceivedMusicState = true;
                    syncMusic(data.music);
                }

                if (data.doodles_enabled !== undefined && data.doodles_enabled !== doodlesEnabled) {
                    doodlesEnabled = Boolean(data.doodles_enabled);
                    redrawAllDoodles();
                }

                const currentImageEffect = data.effect || 'gleam3';
                const animationSignature = data.animation?.type === 'triframe' && Array.isArray(data.animation.frames)
                    ? data.animation.frames.join('|')
                    : '';
                const isNewImage = data.latest && (
                    data.time > lastTime
                    || data.latest !== lastImageRawUrl
                    || currentImageEffect !== lastImageEffect
                    || animationSignature !== lastAnimationSignature
                );

                if (isFirstCanvasLoad) {
                    isFirstCanvasLoad = false;
                    if (data.latest) {
                        lastTime = data.time;
                        lastImageRawUrl = data.latest;
                        lastImageEffect = currentImageEffect;
                        lastAnimationSignature = animationSignature;
                        if (animationSignature) {
                            playImageSequence(data.animation.frames, {
                                frameDuration: data.animation.frame_duration_ms || 1400,
                                crossfadeDuration: data.animation.crossfade_duration_ms || 500,
                            });
                        } else {
                            const newImgUrl = data.latest + "?t=" + new Date().getTime();
                            applyImageTransition(newImgUrl, 'none', currentImageEffect);
                        }
                    }
                } else if (isNewImage) {
                    lastTime = data.time;
                    lastImageRawUrl = data.latest;
                    lastImageEffect = currentImageEffect;
                    lastAnimationSignature = animationSignature;

                    doodleActions = [];
                    redrawAllDoodles();

                    if (animationSignature) {
                        playImageSequence(data.animation.frames, {
                            frameDuration: data.animation.frame_duration_ms || 1400,
                            crossfadeDuration: data.animation.crossfade_duration_ms || 500,
                        });
                    } else {
                        const newImgUrl = data.latest + "?t=" + new Date().getTime();
                        const transition = (data.transition || 'crossfade').toLowerCase().trim();
                        applyImageTransition(newImgUrl, transition, currentImageEffect);
                    }
                }
            } catch (err) {
                console.error("OBS Canvas fetch error:", err);
            }
        }

        // Connect WebSocket for Doodles Sync
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProtocol}//${window.location.host}/ws/doodle` + (currenttheaterId ? `?theater_id=${encodeURIComponent(currenttheaterId)}` : '');
        const ws = new WebSocket(wsUrl);

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'doodles_toggle') {
                doodlesEnabled = Boolean(data.enabled);
                redrawAllDoodles();
            } else if (data.type === 'clear') {
                doodleActions = [];
                redrawAllDoodles();
            } else if (data.type === 'doodle_snapshot') {
                doodleActions = [];
                redrawAllDoodles();
                (data.batches || []).forEach((batch) => {
                    const points = batch.points || [];
                    const rect = doodleCanvas.getBoundingClientRect();
                    for (let index = 0; index < points.length - 2; index += 2) {
                        const action = { type: 'draw', x0: points[index], y0: points[index + 1], x1: points[index + 2], y1: points[index + 3], color: batch.color, size: batch.size || 3 };
                        doodleActions.push(action);
                        renderSegment(action.x0 * rect.width, action.y0 * rect.height, action.x1 * rect.width, action.y1 * rect.height, action.color, action.size);
                    }
                });
            } else if (data.type === 'draw_batch') {
                const points = data.points || [];
                const rect = doodleCanvas.getBoundingClientRect();
                for (let index = 0; index < points.length - 2; index += 2) {
                    const action = { type: 'draw', x0: points[index], y0: points[index + 1], x1: points[index + 2], y1: points[index + 3], color: data.color, size: data.size || 3 };
                    doodleActions.push(action);
                    renderSegment(action.x0 * rect.width, action.y0 * rect.height, action.x1 * rect.width, action.y1 * rect.height, action.color, action.size);
                }
            } else if (data.type === 'draw') {
                doodleActions.push(data);
                if (doodleCanvas) {
                    const rect = doodleCanvas.getBoundingClientRect();
                    renderSegment(
                        data.x0 * rect.width, data.y0 * rect.height,
                        data.x1 * rect.width, data.y1 * rect.height,
                        data.color, data.size || 3
                    );
                }
            }
        };

        // Initialize Canvas & Start Sync
        resizeRendererCanvas();
        resizeDoodleCanvas();
        fetchLatestImage();

        // Keep image/doodle collaboration concerns separate. This socket only
        // says when REST state is stale; it does not carry render data.
        let canvasStateWs = null;
        let canvasStateReconnectDelay = 1000;
        let canvasStateReconnectTimer = null;
        let canvasStateFallbackTimer = null;

        function stopCanvasStateFallbackPolling() {
            if (canvasStateFallbackTimer) {
                clearInterval(canvasStateFallbackTimer);
                canvasStateFallbackTimer = null;
            }
        }

        function startCanvasStateFallbackPolling() {
            if (canvasStateFallbackTimer) return;
            canvasStateFallbackTimer = setInterval(() => {
                if (!document.hidden) fetchLatestImage();
            }, 30000);
        }

        function connectCanvasStateSocket() {
            const stateWsUrl = `${wsProtocol}//${window.location.host}/ws/canvas-state` +
                (currenttheaterId ? `?theater_id=${encodeURIComponent(currenttheaterId)}` : '');
            canvasStateWs = new WebSocket(stateWsUrl);
            canvasStateWs.onopen = () => {
                canvasStateReconnectDelay = 1000;
                stopCanvasStateFallbackPolling();
            };
            canvasStateWs.onmessage = event => {
                try {
                    const message = JSON.parse(event.data);
                    if (message.type === 'state_ready' ||
                        (message.type === 'state_changed' && message.domains?.includes('latest'))) {
                        fetchLatestImage();
                    } else if (message.type === 'scene_speech_ready') {
                        enqueueSceneSpeech(message.audio_url);
                    }
                } catch (error) {
                    console.warn('Ignoring invalid canvas-state message.', error);
                }
            };
            canvasStateWs.onclose = () => {
                canvasStateWs = null;
                startCanvasStateFallbackPolling();
                if (!canvasStateReconnectTimer) {
                    canvasStateReconnectTimer = setTimeout(() => {
                        canvasStateReconnectTimer = null;
                        connectCanvasStateSocket();
                    }, canvasStateReconnectDelay);
                    canvasStateReconnectDelay = Math.min(canvasStateReconnectDelay * 2, 30000);
                }
            };
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && (!canvasStateWs || canvasStateWs.readyState !== WebSocket.OPEN)) {
                fetchLatestImage();
            }
        });
        connectCanvasStateSocket();
    </script>
</body>

</html>
