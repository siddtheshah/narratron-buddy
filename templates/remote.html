<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#10141b">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Narratron Remote</title>
    <script src="/static/js/device-navigation.js"></script>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/css/remote.css">
    <script src="/static/js/remote.js" defer></script>
</head>
<body>
<main>
    <header><a href="/" aria-label="Narratron home"><span class="brand-mark" aria-hidden="true">N</span>NARRATRON</a><span id="theater-id" aria-label="Theater ID"></span><a id="canvas-link" hidden>Open canvas ↗</a><span class="badge">REMOTE</span></header>
    <div id="remote-controls">
    <fieldset id="controls" disabled>
        <legend class="sr-only">Theater controls</legend>
        <section class="bar" aria-labelledby="agent-title">
            <h2 id="agent-title">Agent</h2>
            <span id="connection-status" class="sr-only" role="status">Connecting…</span>
            <button id="agent-toggle" class="power-button" aria-pressed="false" aria-label="Turn agent on" title="Turn agent on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9M6.3 5.8a9 9 0 1 0 11.4 0"/></svg></button>
        </section>
        <section class="bar" aria-labelledby="audience-title">
            <h2 id="audience-title">Collab</h2>
            <span id="collaboration-status" class="sr-only" role="status">Collaboration off</span>
            <button id="collaboration" class="power-button" aria-pressed="false" aria-label="Turn collaboration on" title="Turn collaboration on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9M6.3 5.8a9 9 0 1 0 11.4 0"/></svg></button>
        </section>
        <section class="bar" aria-labelledby="scene-title">
            <h2 id="scene-title">Scene</h2>
            <button data-action="previous_image" aria-label="Previous scene">←</button>
            <button data-action="toggle_canvas_pin" class="pin-button" aria-pressed="false" aria-label="Pin scene" title="Pin scene" id="scene-pin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l-1 6 4 4v2H6v-2l4-4-1-6ZM12 15v6"/></svg></button>
            <button data-action="next_image" aria-label="Next scene">→</button>
            <button class="primary generate-button" data-action="new_image" data-live aria-label="New image" title="New image"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 3 2.5 6.5L22 12l-6.5 2.5L13 21l-2.5-6.5L4 12l6.5-2.5L13 3ZM4 2v5M1.5 4.5h5M4 18v4M2 20h4"/></svg></button>
        </section>
        <section class="bar" aria-labelledby="music-title">
            <h2 id="music-title">Music</h2>
            <button data-action="previous_music" aria-label="Previous track">←</button>
            <button data-action="toggle_music_pin" class="pin-button" aria-pressed="false" aria-label="Pin music" title="Pin music" id="music-pin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l-1 6 4 4v2H6v-2l4-4-1-6ZM12 15v6"/></svg></button>
            <button data-action="next_music" aria-label="Next track">→</button>
            <button class="primary generate-button" data-action="new_music" data-live aria-label="New music" title="New music"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 3 2.5 6.5L22 12l-6.5 2.5L13 21l-2.5-6.5L4 12l6.5-2.5L13 3ZM4 2v5M1.5 4.5h5M4 18v4M2 20h4"/></svg></button>
        </section>
        <section class="bar" aria-labelledby="direction-title">
            <h2 id="direction-title">Direction</h2>
            <button data-action="update_story" data-live>Update story</button>
        </section>
        <form id="command-form" class="bar">
            <label for="command" class="sr-only">Tell Narratron what happens next</label>
            <input id="command" maxlength="2000" placeholder="Direct the story…" required>
            <button class="primary" type="submit" data-live aria-label="Send instruction">Send</button>
        </form>
    </fieldset>
    <button id="open-preview" type="button" aria-controls="canvas-preview">Preview canvas</button>
    </div>
    <section id="canvas-preview" aria-labelledby="preview-title" hidden>
        <div class="preview-heading"><button id="close-preview" type="button" aria-label="Back to controls">←</button><h2 id="preview-title">Canvas preview</h2><span id="preview-status" role="status">Connecting…</span></div>
        <div class="preview-frame">
            <img id="preview-image" alt="Current canvas scene" hidden decoding="async" referrerpolicy="no-referrer">
            <p id="preview-placeholder">Waiting for the canvas…</p>
        </div>
    </section>
    <p id="feedback" class="sr-only" role="status" aria-live="polite"></p>
</main>
</body>
</html>
