# Sticky contracts: every topic has exactly one writer.
# Field descriptions and initial values are strings; quote numbers and booleans.
# render is optional; defaults to field: value | field: value.
"Player Character":
  owner: recorder
  description: "Player identity, objective, and condition established during play."
  fields:
    name:
      description: "Player-provided character name"
      initial: "Not established"
    goal:
      description: "Established current objective"
      initial: "Not established"
    condition:
      description: "Established physical and mental condition"
      initial: "Not established"

"Current Scene":
  owner: recorder
  description: "The established location and characters currently present."
  fields:
    location:
      description: "Current canonical location name"
      initial: "Not established"
    characters:
      description: "Canonical names of characters present"
      initial: "Not established"

"Upcoming Encounter Suggestion":
  owner: planner
  hidden: true
  description: "One contingent encounter prepared from established events and shared lore."
  fields:
    encounter:
      description: "Next possible obstacle, opportunity, or NPC intention"
      initial: "Await the opening premise"
    story_goal:
      description: "Choice or discovery this encounter could support"
      initial: "Offer a meaningful player choice"
    drama:
      description: "Stakes grounded in established facts"
      initial: "To be established through play"
