<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Layered Animation Bench</title><style>
body{margin:0;background:#0b1020;color:#e9edff;font:15px/1.45 system-ui;padding:24px}main{max-width:1100px;margin:auto}.panel{background:#151b2e;border:1px solid #303c60;border-radius:10px;padding:16px;margin:14px 0}select,textarea,button{background:#0d1324;color:inherit;border:1px solid #4b5b85;border-radius:6px;padding:8px}textarea{width:100%;min-height:85px}button{cursor:pointer;background:#7657d6}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.prompt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.choice{display:block;border:1px solid #303c60;border-radius:8px;padding:10px;cursor:pointer}.choice:has(input:checked){outline:2px solid #8b6cff;border-color:transparent}.choice strong,.choice small{display:block}.choice small{color:#aab4cc;margin-top:4px}.custom{margin-top:12px;padding-top:12px;border-top:1px solid #303c60}.stage{position:relative;width:min(900px,100%);aspect-ratio:16/9;background:#050812;overflow:hidden;border-radius:8px}.stage img{position:absolute;width:100%;height:100%;object-fit:contain;inset:0;transform-origin:center}.debug{white-space:pre-wrap;overflow:auto;max-height:340px;color:#b9c6ed}small{color:#aab4cc}
</style></head><body><main><h1>Layered Animation Bench</h1><p>Generate a default or custom scene, plan its layers with the text provider, then decompose it with <code>fal-ai/qwen-image-layered</code>. The debug trace retains every prompt, plan, and provider result.</p><section class="panel"><div class="row"><label>Base image provider <select id="provider"></select></label><button id="run">Run decomposition</button></div><h2>Default prompts</h2><div id="prompts" class="prompt-grid"></div><div class="custom"><label><input id="useCustomPrompt" type="radio" name="prompt-choice"> Write-in prompt</label><p><textarea id="customPromptText" placeholder="Enter a custom scene prompt to benchmark…"></textarea></p></div><small id="status">Loading catalog…</small></section><section class="panel"><div id="stage" class="stage"></div><p id="layers"></p></section><section class="panel"><h2>Debug trace</h2><pre id="debug" class="debug">No run yet.</pre></section></main><script type="module">
import { layerCssTransform } from '/effects-static/js/animation-effects.js';
let raf;const $=id=>document.getElementById(id);function render(manifest){cancelAnimationFrame(raf);const stage=$('stage');stage.textContent='';const items=manifest.layers||[];for(const layer of items){const image=new Image();image.src=layer.url;image.alt=layer.name;stage.append(image);layer.image=image}const started=performance.now();function tick(now){for(const layer of items){layer.image.style.transform=layerCssTransform(layer.effect,(now-started)/1000)}raf=requestAnimationFrame(tick)}raf=requestAnimationFrame(tick);$('layers').textContent=items.map(x=>`${x.order+1}. ${x.name} — ${x.effect}: ${x.description}`).join(' | ')}
async function load(){const data=await (await fetch('/api/animation-benchmark/catalog')).json();data.providers.filter(p=>p.status==='available').forEach(p=>$('provider').add(new Option(p.name,p.id)));if(!$('provider').options.length)data.providers.forEach(p=>$('provider').add(new Option(p.name,p.id)));data.prompts.forEach((p,index)=>{const input=document.createElement('input');input.type='radio';input.name='prompt-choice';input.value=p.id;input.checked=index===0;const label=document.createElement('label');label.className='choice';label.append(input,Object.assign(document.createElement('strong'),{textContent:p.title}),Object.assign(document.createElement('small'),{textContent:p.prompt}));$('prompts').append(label)});$('status').textContent='Ready.'}$('customPromptText').oninput=()=>{$('useCustomPrompt').checked=true};$('run').onclick=async()=>{const custom=$('customPromptText').value.trim(),selected=document.querySelector('input[name="prompt-choice"]:checked');const body={provider_id:$('provider').value};if($('useCustomPrompt').checked){if(!custom){$('status').textContent='Enter a write-in prompt.';return}body.prompt=custom}else body.prompt_id=selected?.value;$('run').disabled=true;$('status').textContent='Running layer plan and base generation…';const response=await fetch('/api/animation-benchmark/runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let run=await response.json();if(!response.ok){$('debug').textContent=JSON.stringify(run,null,2);$('run').disabled=false;return}const poll=async()=>{run=await (await fetch('/api/animation-benchmark/runs/'+run.id)).json();const seconds=run.latency_ms==null?'':` in ${(run.latency_ms/1000).toFixed(2)} s`;$('status').textContent=run.status==='completed'?`Completed${seconds}.`:run.status==='failed'?`Failed${seconds}.`:run.status;$('debug').textContent=JSON.stringify(run,null,2);if(run.status==='running')setTimeout(poll,500);else{$('run').disabled=false;if(run.status==='completed')render(run.manifest)}};poll()};load().catch(e=>$('status').textContent=String(e));
</script></body></html>
