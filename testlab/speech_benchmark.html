<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speech Provider Bench</title><style>
:root{color-scheme:dark;--panel:#151b2e;--border:#303c60;--accent:#9b87f5;--muted:#aab4cc}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f4f5fb;font:16px/1.5 Inter,system-ui,sans-serif}main{width:min(1180px,calc(100% - 32px));margin:32px auto}.intro,.muted{color:var(--muted)}.panel{margin:18px 0;padding:18px;border:1px solid var(--border);border-radius:12px;background:var(--panel)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.choice{display:grid;gap:6px;padding:12px;border:1px solid var(--border);border-radius:9px;cursor:pointer}.choice:has(input:checked){border-color:var(--accent)}small{color:var(--muted)}button{padding:10px 14px;border:0;border-radius:7px;background:var(--accent);color:#fff;cursor:pointer}.actions{display:flex;gap:12px;align-items:center}.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.result{padding:14px;border:1px solid var(--border);border-radius:9px}.error{border-color:#c45b68}.error-text{color:#ff9fa8}audio{width:100%}input,select{accent-color:var(--accent)}
</style></head><body><main><a href="/" class="muted">← Test Lab</a><h1>Speech Provider Bench</h1><p class="intro">Compare the same narrative dialogue across Gemini Flash TTS and ByteDance Seed Speech v2 on FAL. The bench records latency, playable output, estimated cost, and model metadata.</p><section class="panel"><h2>Providers</h2><div id="providers" class="grid"></div></section><section class="panel"><h2>Dialogue lines</h2><div id="prompts" class="grid"></div></section><div class="actions"><button id="run">Run selected speech comparison</button><span id="status" class="muted">Select available providers and dialogue lines.</span></div><section id="results-panel" class="panel" hidden><h2>Results</h2><div id="results" class="results"></div></section></main><script>
const s={catalog:null,run:null};const el=(t,a={},c=[])=>{const n=document.createElement(t);Object.assign(n,a);c.forEach(x=>n.append(x));return n};
function option(id,key,value){const i=el('input',{value});i.dataset.provider=id;i.dataset.option=key;return i}
function render(c){const ps=document.querySelector('#providers'),ls=document.querySelector('#prompts');c.providers.forEach(p=>{const checked=p.status==='available',box=el('input',{type:'checkbox',value:p.id,checked,disabled:!checked});const kids=[box,el('strong',{textContent:p.name}),el('small',{textContent:p.model}),el('small',{textContent:p.notes}),el('small',{textContent:p.estimated_cost_usd_1k_chars==null?'Cost estimate pending':`~$${p.estimated_cost_usd_1k_chars.toFixed(3)} / 1k chars`}),el('span',{className:'muted',textContent:p.status})];const voice=option(p.id,'voice',p.voice);voice.placeholder='Voice';kids.push(el('small',{textContent:'Voice override'}),voice);ps.append(el('label',{className:'choice'},kids))});c.prompts.forEach((p,i)=>ls.append(el('label',{className:'choice'},[el('input',{type:'checkbox',value:p.id,checked:i===0}),el('strong',{textContent:p.title}),el('small',{textContent:p.dimension}),el('small',{textContent:`“${p.text}”`}),el('small',{textContent:p.voice_instruction})])))}
function selected(id){return [...document.querySelectorAll(`#${id} input[type=checkbox]:checked`)].map(x=>x.value)}function options(){const v={};document.querySelectorAll('[data-provider]').forEach(x=>{if(x.value.trim())(v[x.dataset.provider]??={})[x.dataset.option]=x.value.trim()});return v}
function show(run){document.querySelector('#results-panel').hidden=false;const out=document.querySelector('#results');out.innerHTML='';const p=Object.fromEntries(s.catalog.prompts.map(x=>[x.id,x])),providers=Object.fromEntries(s.catalog.providers.map(x=>[x.id,x]));run.items.sort((a,b)=>a.started_at-b.started_at).forEach(i=>{const card=el('article',{className:`result ${i.status==='failed'?'error':''}`});card.append(el('strong',{textContent:`${providers[i.provider_id].name} · ${p[i.prompt_id].title}`}),el('p',{className:'muted',textContent:`${(i.latency_ms/1000).toFixed(2)} s · ${i.model||''}`}));if(i.audio_url)card.append(el('audio',{controls:true,src:i.audio_url}));if(i.estimated_output_cost_usd!=null)card.append(el('small',{textContent:`Estimated output cost: $${i.estimated_output_cost_usd.toFixed(4)}`}));if(i.error)card.append(el('p',{className:'error-text',textContent:i.error}));out.append(card)})}
async function poll(id){const r=await fetch(`/api/speech-benchmark/runs/${id}`),run=await r.json();s.run=run;show(run);if(run.status==='completed'){document.querySelector('#run').disabled=false;document.querySelector('#status').textContent=`Completed ${run.total} speech comparisons.`}else{document.querySelector('#status').textContent=`Running ${run.items.length}/${run.total} comparisons…`;setTimeout(()=>poll(id),300)}}
document.querySelector('#run').onclick=async()=>{const provider_ids=selected('providers'),prompt_ids=selected('prompts');if(!provider_ids.length||!prompt_ids.length){document.querySelector('#status').textContent='Select at least one available provider and dialogue line.';return}document.querySelector('#run').disabled=true;const r=await fetch('/api/speech-benchmark/runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider_ids,prompt_ids,provider_options:options()})}),x=await r.json();if(!r.ok){document.querySelector('#status').textContent=x.detail||'Could not start the comparison.';document.querySelector('#run').disabled=false;return}poll(x.id)};
fetch('/api/speech-benchmark/catalog').then(r=>r.json()).then(c=>{s.catalog=c;render(c)}).catch(()=>document.querySelector('#status').textContent='Could not load speech providers.');
</script></body></html>
