[pytest]
pythonpath = .
addopts = -n auto --import-mode=importlib --disable-socket --allow-unix-socket
required_plugins = pytest-xdist pytest-socket pytest-env
env =
    PYTHON_DOTENV_DISABLED=1
    NARRATRON_CEL_BACKEND=python
norecursedirs = scratch .venv .git theaters adventures games
filterwarnings =
    ignore:.*JSON_SCHEMA_FOR_FUNC_DECL.*:UserWarning

