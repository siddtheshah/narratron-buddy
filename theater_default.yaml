agent:
    proactivity: false
    affective_dialog: false
    special_instructions: "be calm, serene, and encouraging to the orator"

# Optional reference image filename or alias to show when a new canvas initializes.
# The image must be present in the theater's references directory.
starting_image: "narratron_avatar.jpg"

observability_tool:
    enabled: false
    cooldown_duration: 30

visuals:
    cycle_length: 6
    style: "wistful and bygone glories"

image_generation:
    # Disable AI image creation while keeping mounted/reference images available
    # for the agent to browse and show on the canvas.
    enabled: true
    cooldown_duration: 6

animation:
    enabled: false
    cooldown_duration: 20
    # Force a single animation type across the theater, bypassing classification.
    # Supported values: 'triframe', 'layered', 'video', or null (automatic classification).
    forced_technique: null

interactive_canvas:
    enabled: false
    max_surfaces: 5
    cooldown_duration: 10

music:
    use_generated_music: false
    generation_cooldown: 90
    switch_cooldown: 15
    style: "no lyrics, instrumental focus, steady volume, 90 second duration, loopable ambiance"

story_planning:
    max_named_elements: 5
    initial_elements: {}
    # Optional schema-backed sticky contracts. Each topic declares an object
    # JSON Schema, a conforming initial mapping, and an optional render string.
    # When present, the deep planner must return this exact typed JSON shape.
    stickies: {}
    # List of sticky note keys/topics that the story planner must always retain and never drop
    required_stickies: []
    # Names of sticky notes to hide in the canvas UI view by default until toggled
    hidden_stickies: []

    adventure_mode: false
    # Immediately generate and publish an opening scene through the story
    # planner when the user connects to an Adventure Mode session.
    auto_begin: false
    # When Adventure Mode NPC dialogue is enabled, synthesize each spoken line
    # with a stable, automatically assigned Seed Speech voice.
    character_voicing: false
    # In Adventure Mode, apply dynamic visual text effects (vibrating,
    # scintillating, glitch, fonts) to high-energy spans using TextBeautifier.
    text_beautification: true
    # Adventure Mode uses a shallow background planning heartbeat. Completed
    # responder turns enter an ordered queue; each heartbeat assimilates a
    # bounded batch and publishes typed sticky state.
    # Adventure-specific durable concepts belong in the sticky schemas above.
    deep_planning:
        enabled: true
        heartbeat_seconds: 1
        max_events_per_turn: 4
        thinking_budget: 2048
        max_output_tokens: 6144
        timeout_seconds: 45
        failure_retries: 2
        # Optional extra refinement heartbeats after the response queue drains.
        # Keep at zero by default to avoid unbounded idle model usage.
        idle_refinement_turns: 0
    # Guidance for the Adventure Mode story planner. Theater creators can
    # override this with a voice, tone, or consequence philosophy (for
    # example: "harsh and unforgiving, but never arbitrary").
    style: "balanced, consequence-driven, and player-agency-first"
    cooldown_duration: 7
    require_user_input: true
    # Each completed planner response adds one second per 15 returned words,
    # up to this limit, before accepting the next player action.
    action_cooldown_words_per_second: 20
    action_cooldown_max_seconds: 25

chat:
    cooldown_duration: 20
