agent:
    proactivity: false
    affective_dialog: false
    special_instructions: "be calm, serene, and encouraging to the orator"

# Optional reference image filename or alias to show when a new canvas initializes.
# The image must be present in the theater's references directory.
starting_image: "narratron_avatar.jpg"

observability_tool:
    enabled: false
    cooldown_duration: 30

image_generation:
    cycle_length: 7
    cooldown_duration: 8
    style: "wistful and bygone glories"

animation:
    enabled: false
    cooldown_duration: 20

interactive_canvas:
    enabled: false
    max_surfaces: 5
    cooldown_duration: 10

music:
    use_generated_music: false
    playlists_folder: "playlists"
    generation_cooldown: 90
    switch_cooldown: 15
    style: "no lyrics, instrumental focus, steady volume, 90 second duration, loopable ambiance"

story_planning:
    max_named_elements: 5
    initial_elements: {}
    # List of sticky note keys/topics that the story planner must always retain and never drop
    required_stickies: []

    adventure_mode: false
    # When Adventure Mode NPC dialogue is enabled, synthesize each spoken line
    # with a stable, automatically assigned Seed Speech voice.
    character_voicing: false
    nodes_ahead: 3
    # Guidance for the Adventure Mode story planner. Theater creators can
    # override this with a voice, tone, or consequence philosophy (for
    # example: "harsh and unforgiving, but never arbitrary").
    style: "balanced, consequence-driven, and player-agency-first"
    cooldown_duration: 10
    require_voice_input: true
    # Each completed planner response adds one second per 15 returned words,
    # up to this limit, before accepting the next player action.
    action_cooldown_words_per_second: 15
    action_cooldown_max_seconds: 25

chat:
    cooldown_duration: 9
