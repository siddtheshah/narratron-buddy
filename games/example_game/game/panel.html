<!doctype html>
<html>
<head>
  <title>Checkers Club</title>
  <style>
    body { margin: 0; color: #eef3fb; font: 14px system-ui, sans-serif; }
    [hidden] { display: none !important; }
    header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    h1 { font-size: 20px; margin: 0; }
    button { font: inherit; color: inherit; cursor: pointer; }
    header button { margin-left: auto; padding: 6px 10px; background: #34465c; border: 1px solid #9aa8b7; border-radius: 6px; }
    button:disabled { cursor: default; }
    #status { color: #f8d887; margin: 8px 0; }
    .board { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); width: min(100%, calc(100vh - 90px)); max-width: 420px; margin-inline: auto; }
    .light, .square { aspect-ratio: 1; min-width: 0; }
    .light { background: #9aa8b7; }
    .square { container-type: inline-size; position: relative; display: grid; place-items: center; background: #34465c; border: 0; border-radius: 0; padding: 0; }
    .square:focus-visible { outline: 3px solid white; outline-offset: -3px; z-index: 1; }
    .selection { position: absolute; inset: 2px; border: 3px solid #facc15; pointer-events: none; }
    .piece { position: absolute; inset: 10%; width: 80%; height: 80%; box-sizing: border-box; display: grid; place-items: center; border-radius: 50%; border: 2px solid #ffffff66; color: #fff; font-size: 55cqw; line-height: 1; box-shadow: 0 2px 3px #0008; }
    .red { background: #e05252; }
    .ivory { background: #d6bd8a; }
    .target { position: absolute; color: #fde047; font-size: 24px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    .help { color: #b9c6d8; font-size: 13px; line-height: 1.5; }
  </style>
</head>
