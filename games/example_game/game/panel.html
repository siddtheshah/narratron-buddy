<!doctype html>
<html>
<head>
  <title>Tic-Tac-Toe</title>
  <style>
    :root {
      --panel-width: 380px;
      --panel-height: 440px;
    }
    body {
      margin: 0;
      color: #eef3fb;
      font: 14px system-ui, sans-serif;
      background: #1e293b;
      padding: 16px;
      box-sizing: border-box;
    }
    [hidden] { display: none !important; }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 18px;
      margin: 0;
      letter-spacing: 0.5px;
    }
    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
    }
    header button {
      margin-left: auto;
      padding: 6px 12px;
      background: #334155;
      border: 1px solid #64748b;
      border-radius: 6px;
      transition: background 0.15s;
    }
    header button:hover {
      background: #475569;
    }
    button:disabled {
      cursor: default;
    }
    #status {
      color: #f8d887;
      font-size: 15px;
      font-weight: 600;
      margin: 0 0 4px 0;
    }
    #receipt {
      color: #94a3b8;
      font-size: 12px;
      margin: 0 0 16px 0;
      min-height: 16px;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      width: min(100%, 260px);
      margin: 0 auto;
    }
    .square {
      aspect-ratio: 1;
      position: relative;
      display: grid;
      place-items: center;
      background: #334155;
      border: 2px solid #475569;
      border-radius: 8px;
      padding: 0;
      font-size: 40px;
      font-weight: 800;
      line-height: 1;
      transition: background 0.15s, border-color 0.15s;
    }
    .square:not(:disabled):hover {
      background: #475569;
      border-color: #facc15;
    }
    .square:focus-visible {
      outline: 3px solid #facc15;
      outline-offset: -2px;
      z-index: 1;
    }
    .mark-x {
      color: #38bdf8;
    }
    .mark-o {
      color: #f43f5e;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
    }
  </style>
</head>
<body>
  <header>
    <h1>Tic-Tac-Toe</h1>
    <img src="crest.svg" alt="Tic-Tac-Toe crest" width="30" height="30">
    <button data-panel-action="reset">New Game</button>
  </header>
  <p id="status" data-panel-text="status" aria-live="polite"></p>
  <p id="receipt" data-panel-text="receipt"></p>
  <div class="board" role="group" aria-label="Tic-Tac-Toe board">
    <button id="square-0" class="square" data-panel-action="square_0" data-panel-disabled="cells.0.disabled">
      <span class="sr-only" data-panel-text="cells.0.label"></span>
      <span class="mark-x" data-panel-hidden="cells.0.not_x" aria-hidden="true">X</span>
      <span class="mark-o" data-panel-hidden="cells.0.not_o" aria-hidden="true">O</span>
    </button>
    <button id="square-1" class="square" data-panel-action="square_1" data-panel-disabled="cells.1.disabled">
      <span class="sr-only" data-panel-text="cells.1.label"></span>
      <span class="mark-x" data-panel-hidden="cells.1.not_x" aria-hidden="true">X</span>
      <span class="mark-o" data-panel-hidden="cells.1.not_o" aria-hidden="true">O</span>
    </button>
    <button id="square-2" class="square" data-panel-action="square_2" data-panel-disabled="cells.2.disabled">
      <span class="sr-only" data-panel-text="cells.2.label"></span>
      <span class="mark-x" data-panel-hidden="cells.2.not_x" aria-hidden="true">X</span>
      <span class="mark-o" data-panel-hidden="cells.2.not_o" aria-hidden="true">O</span>
    </button>
    <button id="square-3" class="square" data-panel-action="square_3" data-panel-disabled="cells.3.disabled">
      <span class="sr-only" data-panel-text="cells.3.label"></span>
      <span class="mark-x" data-panel-hidden="cells.3.not_x" aria-hidden="true">X</span>
      <span class="mark-o" data-panel-hidden="cells.3.not_o" aria-hidden="true">O</span>
    </button>
    <button id="square-4" class="square" data-panel-action="square_4" data-panel-disabled="cells.4.disabled">
      <span class="sr-only" data-panel-text="cells.4.label"></span>
      <span class="mark-x" data-panel-hidden="cells.4.not_x" aria-hidden="true">X</span>
      <span class="mark-o" data-panel-hidden="cells.4.not_o" aria-hidden="true">O</span>
    </button>
    <button id="square-5" class="square" data-panel-action="square_5" data-panel-disabled="cells.5.disabled">
      <span class="sr-only" data-panel-text="cells.5.label"></span>
      <span class="mark-x" data-panel-hidden="cells.5.not_x" aria-hidden="true">X</span>
      <span class="mark-o" data-panel-hidden="cells.5.not_o" aria-hidden="true">O</span>
    </button>
    <button id="square-6" class="square" data-panel-action="square_6" data-panel-disabled="cells.6.disabled">
      <span class="sr-only" data-panel-text="cells.6.label"></span>
      <span class="mark-x" data-panel-hidden="cells.6.not_x" aria-hidden="true">X</span>
      <span class="mark-o" data-panel-hidden="cells.6.not_o" aria-hidden="true">O</span>
    </button>
    <button id="square-7" class="square" data-panel-action="square_7" data-panel-disabled="cells.7.disabled">
      <span class="sr-only" data-panel-text="cells.7.label"></span>
      <span class="mark-x" data-panel-hidden="cells.7.not_x" aria-hidden="true">X</span>
      <span class="mark-o" data-panel-hidden="cells.7.not_o" aria-hidden="true">O</span>
    </button>
    <button id="square-8" class="square" data-panel-action="square_8" data-panel-disabled="cells.8.disabled">
      <span class="sr-only" data-panel-text="cells.8.label"></span>
      <span class="mark-x" data-panel-hidden="cells.8.not_x" aria-hidden="true">X</span>
      <span class="mark-o" data-panel-hidden="cells.8.not_o" aria-hidden="true">O</span>
    </button>
  </div>
</body>
</html>
