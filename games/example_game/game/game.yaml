# Tic-Tac-Toe reference game package.
# See site_docs/game_packages.md for the format. CEL expressions use |- for multiple lines.

version: 2

# Commit the victory reward to the shared page through the game/canvas API.
canvas_api:
  version: 1
  effects: [put_stamp, remove_stamp]

# Starting position and UI state. 0: empty, 1: X (Player), -1: O (Narratron).
initial:
  board: [0, 0, 0, 0, 0, 0, 0, 0, 0]
  turn: 1
  winner: 0
  draw: false
  receipt: Select an empty square to place X.

# Every saved position and move result must satisfy this schema.
state_schema:
  type: object
  properties:
    board:
      type: array
      minItems: 9
      maxItems: 9
      items:
        enum: [-1, 0, 1]
    turn:
      enum: [-1, 1]
    winner:
      enum: [-1, 0, 1]
    draw:
      type: boolean
    receipt:
      type: string
      maxLength: 300
  required: [board, turn, winner, draw, receipt]
  additionalProperties: false

# Board coordinates and winning line configurations.
constants:
  indices: [0, 1, 2, 3, 4, 5, 6, 7, 8]
  winning_lines:
    - {a: 0, b: 1, c: 2}
    - {a: 3, b: 4, c: 5}
    - {a: 6, b: 7, c: 8}
    - {a: 0, b: 3, c: 6}
    - {a: 1, b: 4, c: 7}
    - {a: 2, b: 5, c: 8}
    - {a: 0, b: 4, c: 8}
    - {a: 2, b: 4, c: 6}

# Reusable CEL functions.
functions:
  checkWin:
    parameters: [board, side]
    expr: |-
      constants.winning_lines.exists(line,
        board[line.a] == side &&
        board[line.b] == side &&
        board[line.c] == side
      )
  isFull:
    parameters: [board]
    expr: |-
      constants.indices.all(i, board[i] != 0)
  coordinate:
    parameters: [index]
    expr: |-
      "(" + string(index / 3) + ", " + string(index % 3) + ")"

# Values recalculated from current state; not persisted.
derived:
  - name: availableCells
    expr: |-
      state.winner != 0 || state.draw ? [] : constants.indices.filter(i, state.board[i] == 0)

invariants:
  - size(state.board) == 9
  - '!state.draw || state.winner == 0'

# Transitions: parameters, validation, intermediate calculations, next state.
transitions:
  move:
    permission: contributor
    description: Place an X in an empty square on the board (indices 0 to 8).
    parameters:
      type: object
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 8
      required: [index]
      additionalProperties: false
    guard: state.turn == 1 && state.winner == 0 && !state.draw && state.board[action.index] == 0
    bindings:
      - name: nextBoard
        expr: |-
          constants.indices.map(i, i == action.index ? 1 : state.board[i])
      - name: won
        expr: |-
          checkWin(nextBoard, 1)
      - name: full
        expr: |-
          isFull(nextBoard)
      - name: isDraw
        expr: |-
          !won && full
      - name: nextTurn
        expr: |-
          won || isDraw ? 1 : -1
      - name: nextWinner
        expr: |-
          won ? 1 : 0
    result: |-
      {"board": nextBoard, "turn": nextTurn, "winner": nextWinner, "draw": isDraw,
      "receipt": won ? "X played at " + coordinate(action.index) + " · X wins!" : isDraw ? "X played at " + coordinate(action.index) + " · Draw game" : "X played at " + coordinate(action.index) + " · O's turn"}
    triggering: true
    canvas_effects: |-
      canvas.page != null && won ? [{
        "op": "put_stamp", "target": {"page_id": canvas.page.id},
        "key": "tictactoe-victory-crown", "asset_id": "stamp:crown",
        "center": {"x": 8500, "y": 1800}, "width": 1600,
        "rotation": 0, "draggable": true
      }] : []

  narratron_move:
    actor: narratron
    description: Place an O in an empty square on Narratron's turn (turn == -1).
    available: state.turn == -1 && state.winner == 0 && !state.draw
    parameters:
      type: object
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 8
      required: [index]
      additionalProperties: false
    guard: state.turn == -1 && state.winner == 0 && !state.draw && state.board[action.index] == 0
    bindings:
      - name: nextBoard
        expr: |-
          constants.indices.map(i, i == action.index ? -1 : state.board[i])
      - name: won
        expr: |-
          checkWin(nextBoard, -1)
      - name: full
        expr: |-
          isFull(nextBoard)
      - name: isDraw
        expr: |-
          !won && full
      - name: nextTurn
        expr: |-
          won || isDraw ? -1 : 1
      - name: nextWinner
        expr: |-
          won ? -1 : 0
    result: |-
      {"board": nextBoard, "turn": nextTurn, "winner": nextWinner, "draw": isDraw,
      "receipt": won ? "O played at " + coordinate(action.index) + " · O wins!" : isDraw ? "O played at " + coordinate(action.index) + " · Draw game" : "O played at " + coordinate(action.index) + " · X's turn"}

  narratron_concede:
    actor: narratron
    description: Concede as O on Narratron's turn, awarding X the win and the victory crown.
    available: state.turn == -1 && state.winner == 0 && !state.draw
    parameters:
      type: object
      additionalProperties: false
    guard: state.turn == -1 && state.winner == 0 && !state.draw
    result: |-
      {"board": state.board, "turn": state.turn, "winner": 1, "draw": false,
      "receipt": "O concedes · X wins!"}
    canvas_effects: |-
      canvas.page != null ? [{
        "op": "put_stamp", "target": {"page_id": canvas.page.id},
        "key": "tictactoe-victory-crown", "asset_id": "stamp:crown",
        "center": {"x": 8500, "y": 1800}, "width": 1600,
        "rotation": 0, "draggable": true
      }] : []

  reset:
    parameters:
      type: object
      additionalProperties: false
    result: initial
    triggering: true
    canvas_effects: |-
      canvas.page != null ? [{
        "op": "remove_stamp", "target": {"page_id": canvas.page.id},
        "key": "tictactoe-victory-crown"
      }] : []

# Passive HTML layout lives in panel.html; all bindings and actions remain CEL.
panel:
  parameters:
    status: |-
      state.winner == 1 ? "X wins!" : state.winner == -1 ? "O wins!" : state.draw ? "Draw — game over" : (state.turn == 1 ? "Your turn (X)" : "Narratron's turn (O)")
    receipt: state.receipt
    cells: |-
      constants.indices.map(i, {
        "label": "Square " + coordinate(i) + (state.board[i] == 1 ? " X" : state.board[i] == -1 ? " O" : " empty"),
        "symbol": state.board[i] == 1 ? "X" : state.board[i] == -1 ? "O" : "",
        "disabled": state.board[i] != 0 || state.turn != 1 || state.winner != 0 || state.draw,
        "not_x": state.board[i] != 1,
        "not_o": state.board[i] != -1,
        "empty": state.board[i] == 0
      })
  actions:
    reset:
      name: '"reset"'
      confirmation: Start a new game? This clears the board.
    square_0:
      permission: contributor
      name: '"move"'
      arguments: '{"index": 0}'
    square_1:
      permission: contributor
      name: '"move"'
      arguments: '{"index": 1}'
    square_2:
      permission: contributor
      name: '"move"'
      arguments: '{"index": 2}'
    square_3:
      permission: contributor
      name: '"move"'
      arguments: '{"index": 3}'
    square_4:
      permission: contributor
      name: '"move"'
      arguments: '{"index": 4}'
    square_5:
      permission: contributor
      name: '"move"'
      arguments: '{"index": 5}'
    square_6:
      permission: contributor
      name: '"move"'
      arguments: '{"index": 6}'
    square_7:
      permission: contributor
      name: '"move"'
      arguments: '{"index": 7}'
    square_8:
      permission: contributor
      name: '"move"'
      arguments: '{"index": 8}'

# Guidance and a concise state projection for Narratron.
instructions: |-
  Tic-Tac-Toe game. You play as O (turn == -1) against the player's X (turn == 1). When turn == -1 and an empty square is available, use 'narratron_move' with the chosen square index (0 to 8).
  On your turn in an unfinished game, you may instead use 'narratron_concede' with no arguments to resign, awarding X the victory. Commit the action before describing the concession as completed.
model_state: |-
  {"board": state.board, "turn": state.turn, "turn_symbol": state.turn == 1 ? "X" : "O",
  "winner": state.winner, "draw": state.draw, "receipt": state.receipt,
  "available_cells": constants.indices.filter(i, state.board[i] == 0)}
