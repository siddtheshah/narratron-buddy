[project]
name = "narratron-buddy"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    "absl-py",
    "av>=12.0.0",
    "cloud-sql-python-connector[pg8000]",
    "fastapi",
    "google-adk",
    "google-cloud-storage>=3.0.0",
    "google-cloud-texttospeech",
    "google-genai>=2.25.0",
    "jinja2",
    "joblib>=1.2.0",
    "jsonschema>=4.0",
    "openai>=1.0",
    "pillow",
    "playwright",
    "pyarrow>=17.0",
    "pytest",
    "pytest-asyncio",
    "python-dotenv>=1.0.1",
    "python-multipart",
    "pyyaml",
    "scikit-learn>=1.5",
    "stripe>=7.0.0",
    "uvicorn",
]

[dependency-groups]
dev = [
    "ruff>=0.12,<0.13",
]

[tool.ruff]
target-version = "py310"
extend-exclude = [
    ".venv",
    "adventures",
    "demos",
    "evaluation_results",
    "output",
    "playlists",
    "reference_library",
    "scratch",
    "theaters",
]

[tool.ruff.lint]
# Start with correctness-focused checks; expand the rule set after the
# existing codebase has a stable baseline.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These executable modules adjust sys.path before importing project code.
"scripts/import_sqlite_to_cloud_sql.py" = ["E402"]
"scripts/migrate_cloud_sql_schema.py" = ["E402"]
"storage/storage_daemon.py" = ["E402"]
"testlab/adventure_runner.py" = ["E402"]
