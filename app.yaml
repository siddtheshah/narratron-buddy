gcloud:
    project_id: "narratron"

# This is an application-wide choice so all theaters use the same image
# generation policy. Provider-specific settings are passed to providers.registry.
image_generation:
    provider: "hybrid-flux-gemini"
    provider_options:
        classifier_model: "gemini-2.5-flash-lite"

smtp:
    from_email: "noreply@narratron.io"
    host: "smtp.gmail.com"
    port: 587

agent_internal:
    model_id: "gemini-3.1-flash-live-preview"
    enable_tool_injection: false
    # Delay state-observability messages so the live agent can receive initial user input.
    observability_startup_delay: 20
    observability_interval: 20
    compaction:
        trigger_tokens: 20000
        target_tokens: 8000

suggestion_model: "gemini-3.6-flash"
