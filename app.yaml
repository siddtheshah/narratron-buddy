gcloud:
    project_id: "narratron"

# This is an application-wide choice so all theaters use the same image
# generation policy. Provider-specific settings are passed to providers.registry.
image_generation:
    provider: "hybrid-flux-gemini"

story_planning:
    planner_model: "gemini-3.6-flash"

interactive_canvas:
    model: "gemini-3.5-flash-lite"

music:
    provider: "lyria"
    catalog_match_threshold: 0.86
    catalog_candidate_count: 5
    catalog_reranker_provider: "gemini-2-5"
    catalog_reranker_model: "gemini-2.5-flash-lite"

smtp:
    from_email: "noreply@narratron.io"
    host: "smtp.gmail.com"
    port: 587

agent_internal:
    model_id: "gemini-3.1-flash-live-preview"
    # Model tool calls allowed after each VAD end before the queue returns to
    # ordinary non-audio scheduling.
    live_tool_budget: 3
    enable_tool_injection: false
    # Delay state-observability messages so the live agent can receive initial user input.
    observability_startup_delay: 30
    observability_interval: 30
    compaction:
        trigger_tokens: 20000
        target_tokens: 8000

suggestion_model: "gemini-3.6-flash"
