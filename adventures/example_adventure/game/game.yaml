# Guidance and a concise state projection for Narratron.
instructions: |-
  request_narratron_action is a player UI request that changes no gameplay state and spends no resources. Review current state and committed events for justified Narratron actions; it grants no rewards, consent, or extra turn. If nothing is due, take no action.
  Checkers game in the Library of Origins. You play Ivory (turn == -1) against the player's Red (turn == 1). When turn == -1 and moves are available, use 'narratron_move' to advance an Ivory piece.
  On your turn in an unfinished game, you may instead use 'narratron_concede' with no arguments to resign, including when the player asks you to concede. This awards Red the win and the victory crown on the current canvas page. Commit the action before describing the concession as completed.
model_state: |-
  {"board": state.board, "turn": state.turn, "turn_name": sideName(state.turn),
  "winner": state.winner, "draw": state.draw, "receipt": state.receipt,
  "red_count": constants.indices.filter(i, state.board[i] > 0).size(),
  "ivory_count": constants.indices.filter(i, state.board[i] < 0).size(),
  "legal_moves": moves.map(m, {"source": m.source, "target": m.target,
  "from": coordinate(m.source), "to": coordinate(m.target),
  "jump": m.jump})}
# HTML panels evaluate each selection and move on the server.
