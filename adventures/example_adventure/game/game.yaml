# Reusable CEL rules. Functions can call functions defined earlier in this section.
functions:
  candidates:
    parameters: [board, side, forced]
    expr: |-
      constants.edges.filter(m,
        board[m.source] * side > 0 && board[m.target] == 0 &&
        (forced < 0 || (m.source == forced && m.jump))
      ).filter(m,
        (board[m.source] == 2 || board[m.source] == -2 ||
          m.dr == (m.jump ? -2 * side : -side)) &&
        (!m.jump || board[m.middle] * side < 0)
      )
  prioritize:
    parameters: [moves]
    expr: 'moves.exists(m, m.jump) ? moves.filter(m, m.jump) : moves'
  legal:
    parameters: [board, side, forced]
    expr: prioritize(candidates(board, side, forced))
  sideName:
    parameters: [side]
    expr: 'side == 1 ? "Red" : "Ivory"'
  coordinate:
    parameters: [index]
    expr: constants.files[index % 8] + string(8 - index / 8)

# Values recalculated from the current state; these are not saved.
derived:
- name: moves
  expr: 'state.winner != 0 || state.draw ? [] : legal(state.board, state.turn, state.forced)'
invariants: ['constants.indices.all(i, state.board[i] == 0 || (i / 8 + i % 8) % 2 == 1)']

# Actions: parameters, legality checks, intermediate calculations, complete next state.
transitions:
  select:
    permission: contributor
    parameters:
      type: object
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 63
      required: [index]
      additionalProperties: false
    guard: moves.exists(m, m.source == action.index)
    result: |-
      {"board": state.board, "turn": state.turn, "forced": state.forced,
      "winner": state.winner, "draw": state.draw, "quiet": state.quiet,
      "receipt": state.receipt, "selected": state.selected == action.index ? -1 : action.index}
    triggering: false
  move:
    permission: contributor
    parameters:
      type: object
      properties:
        source:
          type: integer
          minimum: 0
          maximum: 63
        target:
          type: integer
          minimum: 0
          maximum: 63
      required: [source, target]
      additionalProperties: false
    guard: moves.exists(m, m.source == action.source && m.target == action.target)
    bindings:
    - name: chosen
      expr: moves.filter(m, m.source == action.source && m.target == action.target)[0]
    - name: promoted
      expr: |-
        state.board[action.source] * state.board[action.source] == 1 && ((state.turn == 1 && action.target < 8) || (state.turn == -1 && action.target >= 56))
    - name: board
      expr: |-
        constants.indices.map(i, i == action.source || (chosen.jump && i == chosen.middle) ? 0 : i == action.target ? (promoted ? 2 * state.turn : state.board[action.source]) : state.board[i])
    - name: continuing
      expr: chosen.jump && !promoted && size(legal(board, state.turn, action.target)) > 0
    - name: nextTurn
      expr: 'continuing ? state.turn : -state.turn'
    - name: forced
      expr: 'continuing ? action.target : -1'
    - name: won
      expr: size(legal(board, nextTurn, forced)) == 0
    - name: quiet
      expr: 'chosen.jump || promoted ? 0 : state.quiet + 1'
    result: |-
      {"board": board, "turn": nextTurn, "forced": forced, "selected": continuing ? action.target : -1,
      "winner": won ? -nextTurn : 0, "draw": !won && quiet >= 80,
      "quiet": quiet, "receipt": coordinate(action.source) + " → " + coordinate(action.target) + (chosen.jump ? " · captured a piece" : "") + (promoted ? " · crowned king" : "") + (continuing ? " · continue jumping" : "")}
    triggering: true
    preview: true
  reset:
    parameters:
      type: object
      additionalProperties: false
    result: initial
    triggering: true
  narratron_move:
    actor: narratron
    description: Make an Ivory move on Narratron's turn (turn == -1).
    available: state.turn == -1 && state.winner == 0 && !state.draw
    parameters:
      type: object
      properties:
        source:
          type: integer
          minimum: 0
          maximum: 63
        target:
          type: integer
          minimum: 0
          maximum: 63
      required: [source, target]
      additionalProperties: false
    guard: state.turn == -1 && moves.exists(m, m.source == action.source && m.target == action.target)
    bindings:
    - name: chosen
      expr: moves.filter(m, m.source == action.source && m.target == action.target)[0]
    - name: promoted
      expr: |-
        state.board[action.source] * state.board[action.source] == 1 && ((state.turn == 1 && action.target < 8) || (state.turn == -1 && action.target >= 56))
    - name: board
      expr: |-
        constants.indices.map(i, i == action.source || (chosen.jump && i == chosen.middle) ? 0 : i == action.target ? (promoted ? 2 * state.turn : state.board[action.source]) : state.board[i])
    - name: continuing
      expr: chosen.jump && !promoted && size(legal(board, state.turn, action.target)) > 0
    - name: nextTurn
      expr: 'continuing ? state.turn : -state.turn'
    - name: forced
      expr: 'continuing ? action.target : -1'
    - name: won
      expr: size(legal(board, nextTurn, forced)) == 0
    - name: quiet
      expr: 'chosen.jump || promoted ? 0 : state.quiet + 1'
    result: |-
      {"board": board, "turn": nextTurn, "forced": forced, "selected": -1,
      "winner": won ? -nextTurn : 0, "draw": !won && quiet >= 80,
      "quiet": quiet, "receipt": "Ivory: " + coordinate(action.source) + " → " + coordinate(action.target) + (chosen.jump ? " · captured a piece" : "") + (promoted ? " · crowned king" : "") + (continuing ? " · continue jumping" : "")}

# Board layout. Values under props are CEL expressions; literal text keeps its CEL quotes.
view:
  kind: column
  props:
    gap: '"10px"'
  children:
  - kind: row
    children:
    - kind: text
      props:
        text: '"Checkers Club"'
        fontSize: '"20px"'
    - kind: svg
      props:
        id: '"club-crest"'
        src: '"crest.svg"'
        width: '"32"'
        height: '"32"'
        label: '"Checkers Club crest"'
    - kind: button
      props:
        text: '"New game"'
        label: '"New game"'
      action:
        name: '"reset"'
        confirmation: Start a new game? This replaces the current position.
  - kind: text
    props:
      id: '"status"'
      text: |-
        state.winner != 0 ? sideName(state.winner) + " wins" : state.draw ? "Draw — quiet-turn limit reached" : sideName(state.turn) + " to move" + (state.forced >= 0 ? " · continue the jump" : "")
      color: '"#f8d887"'
  - kind: grid
    props:
      columns: '8'
      gap: '"0px"'
      label: '"Checkers board"'
    children:
    - kind: button
      repeat: constants.indices
      binding: cell
      props:
        id: '"square-" + string(cell)'
        label: |-
          coordinate(cell) + (state.board[cell] == 0 ? " empty" : " " + sideName(state.board[cell] > 0 ? 1 : -1) + (state.board[cell] == 2 || state.board[cell] == -2 ? " king" : " piece"))
        background: '(cell / 8 + cell % 8) % 2 == 0 ? "#9aa8b7" : "#34465c"'
        color: 'state.board[cell] == 0 ? "#fde047" : state.board[cell] > 0 ? "#e05252" : "#d6bd8a"'
        outline: 'cell == state.selected ? "3px solid #facc15" : "none"'
        aspectRatio: '"1"'
        padding: '"0px"'
        borderRadius: '"0px"'
        disabled: '!moves.exists(m, m.source == cell || (m.source == state.selected && m.target == cell))'
        pressed: cell == state.selected
      action:
        name: 'moves.exists(m, m.source == state.selected && m.target == cell) ? "move" : "select"'
        arguments: |-
          moves.exists(m, m.source == state.selected && m.target == cell) ? {"source": state.selected,
          "target": cell} : {"index": cell}
      children:
      - kind: svg
        props:
          viewBox: '"0 0 100 100"'
        children:
        - kind: circle
          props:
            cx: '50'
            cy: '50'
            r: |-
              state.board[cell] != 0 ? 35 : moves.exists(m, m.source == state.selected && m.target == cell) ? 12 : 0
            fill: 'state.board[cell] == 0 ? "#fde047" : state.board[cell] > 0 ? "#e05252" : "#d6bd8a"'
            stroke: '"#ffffff66"'
            stroke-width: '3'
        - kind: svg_text
          props:
            x: '50'
            y: '54'
            text-anchor: '"middle"'
            dominant-baseline: '"middle"'
            fontSize: '"60px"'
            fill: '"#ffffff"'
            text: 'state.board[cell] == 2 || state.board[cell] == -2 ? "♛" : ""'
  - kind: text
    props:
      text: state.receipt
      fontSize: '"14px"'
  - kind: text
    props:
      text: |-
        "Two-player hot seat. Red moves toward rank 8. Select a piece, then a highlighted destination. Captures and continued jumps are mandatory. Kings move both ways. Crowning ends the turn."
      fontSize: '"13px"'
      color: '"#b9c6d8"'

# Guidance and a concise state projection for Narratron.
instructions: |-
  Checkers game in the Library of Origins. You play Ivory (turn == -1) against the player's Red (turn == 1). When turn == -1 and moves are available, use 'narratron_move' to advance an Ivory piece.
model_state: |-
  {"board": state.board, "turn": state.turn, "turn_name": sideName(state.turn),
  "winner": state.winner, "draw": state.draw, "receipt": state.receipt,
  "red_count": constants.indices.filter(i, state.board[i] > 0).size(),
  "ivory_count": constants.indices.filter(i, state.board[i] < 0).size(),
  "legal_moves": moves.map(m, {"source": m.source, "target": m.target,
  "from": coordinate(m.source), "to": coordinate(m.target),
  "jump": m.jump})}
local_preview: true
