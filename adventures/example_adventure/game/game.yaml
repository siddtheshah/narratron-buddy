# Reusable CEL rules. Functions can call functions defined earlier in this section.
functions:
  candidates:
    parameters: [board, side, forced]
    expr: |-
      constants.edges.filter(m, board[m.source] * side > 0
      ).filter(m, board[m.target] == 0
      ).filter(m, forced < 0 || (m.source == forced && m.jump)
      ).filter(m,
        (board[m.source] == 2 || board[m.source] == -2 ||
          m.dr == (m.jump ? -2 * side : -side)) &&
        (!m.jump || board[m.middle] * side < 0)
      )
  prioritize:
    parameters: [moves]
    expr: 'moves.exists(m, m.jump) ? moves.filter(m, m.jump) : moves'
  legal:
    parameters: [board, side, forced]
    expr: prioritize(candidates(board, side, forced))
  sideName:
    parameters: [side]
    expr: 'side == 1 ? "Red" : "Ivory"'
  coordinate:
    parameters: [index]
    expr: constants.files[index % 8] + string(8 - index / 8)

# Values recalculated from the current state; these are not saved.
derived:
- name: moves
  expr: 'state.winner != 0 || state.draw ? [] : legal(state.board, state.turn, state.forced)'
# Compute board affordances once instead of scanning every move for every square.
- name: sources
  expr: moves.map(m, m.source)
- name: targets
  expr: moves.filter(m, m.source == state.selected).map(m, m.target)
invariants: ['constants.indices.all(i, state.board[i] == 0 || (i / 8 + i % 8) % 2 == 1)']

# Actions: parameters, legality checks, intermediate calculations, complete next state.
transitions:
  # A committed request wakes game control without changing gameplay data.
  request_narratron_action:
    actor: player
    permission: contributor
    description: Ask Narratron to review the current game and take any justified action.
    parameters:
      type: object
      additionalProperties: false
    result: state
    triggering: true
  select:
    permission: contributor
    parameters:
      type: object
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 63
      required: [index]
      additionalProperties: false
    guard: moves.exists(m, m.source == action.index)
    result: |-
      {"board": state.board, "turn": state.turn, "forced": state.forced,
      "winner": state.winner, "draw": state.draw, "quiet": state.quiet,
      "receipt": state.receipt, "selected": state.selected == action.index ? -1 : action.index}
    triggering: false
  move:
    permission: contributor
    parameters:
      type: object
      properties:
        source:
          type: integer
          minimum: 0
          maximum: 63
        target:
          type: integer
          minimum: 0
          maximum: 63
      required: [source, target]
      additionalProperties: false
    guard: moves.exists(m, m.source == action.source && m.target == action.target)
    bindings:
    - name: chosen
      expr: moves.filter(m, m.source == action.source && m.target == action.target)[0]
    - name: promoted
      expr: |-
        state.board[action.source] * state.board[action.source] == 1 && ((state.turn == 1 && action.target < 8) || (state.turn == -1 && action.target >= 56))
    - name: board
      expr: |-
        constants.indices.map(i, i == action.source || (chosen.jump && i == chosen.middle) ? 0 : i == action.target ? (promoted ? 2 * state.turn : state.board[action.source]) : state.board[i])
    - name: continuing
      # CEL && evaluates both sides; only search for another jump after a capture.
      expr: 'chosen.jump && !promoted ? size(legal(board, state.turn, action.target)) > 0 : false'
    - name: nextTurn
      expr: 'continuing ? state.turn : -state.turn'
    - name: forced
      expr: 'continuing ? action.target : -1'
    - name: won
      expr: size(legal(board, nextTurn, forced)) == 0
    - name: quiet
      expr: 'chosen.jump || promoted ? 0 : state.quiet + 1'
    result: |-
      {"board": board, "turn": nextTurn, "forced": forced, "selected": continuing ? action.target : -1,
      "winner": won ? -nextTurn : 0, "draw": !won && quiet >= 80,
      "quiet": quiet, "receipt": coordinate(action.source) + " → " + coordinate(action.target) + (chosen.jump ? " · captured a piece" : "") + (promoted ? " · crowned king" : "") + (continuing ? " · continue jumping" : "")}
    triggering: true
    preview: true
    # Red is the player; promoting a checker alone is not a game victory.
    canvas_effects: |-
      state.winner == 0 && next_state.winner == 1 && canvas.page != null ? [{
        "op": "put_stamp", "target": {"page_id": canvas.page.id},
        "key": "checkers-victory-crown", "asset_id": "stamp:crown",
        "center": {"x": 8500, "y": 1800}, "width": 1600,
        "rotation": 0, "draggable": true
      }] : []
  reset:
    parameters:
      type: object
      additionalProperties: false
    result: initial
    triggering: true
    canvas_effects: |-
      canvas.page != null ? [{
        "op": "remove_stamp", "target": {"page_id": canvas.page.id},
        "key": "checkers-victory-crown"
      }] : []
  narratron_move:
    actor: narratron
    description: Make an Ivory move on Narratron's turn (turn == -1).
    available: state.turn == -1 && state.winner == 0 && !state.draw
    parameters:
      type: object
      properties:
        source:
          type: integer
          minimum: 0
          maximum: 63
        target:
          type: integer
          minimum: 0
          maximum: 63
      required: [source, target]
      additionalProperties: false
    guard: state.turn == -1 && moves.exists(m, m.source == action.source && m.target == action.target)
    bindings:
    - name: chosen
      expr: moves.filter(m, m.source == action.source && m.target == action.target)[0]
    - name: promoted
      expr: |-
        state.board[action.source] * state.board[action.source] == 1 && ((state.turn == 1 && action.target < 8) || (state.turn == -1 && action.target >= 56))
    - name: board
      expr: |-
        constants.indices.map(i, i == action.source || (chosen.jump && i == chosen.middle) ? 0 : i == action.target ? (promoted ? 2 * state.turn : state.board[action.source]) : state.board[i])
    - name: continuing
      expr: 'chosen.jump && !promoted ? size(legal(board, state.turn, action.target)) > 0 : false'
    - name: nextTurn
      expr: 'continuing ? state.turn : -state.turn'
    - name: forced
      expr: 'continuing ? action.target : -1'
    - name: won
      expr: size(legal(board, nextTurn, forced)) == 0
    - name: quiet
      expr: 'chosen.jump || promoted ? 0 : state.quiet + 1'
    result: |-
      {"board": board, "turn": nextTurn, "forced": forced, "selected": -1,
      "winner": won ? -nextTurn : 0, "draw": !won && quiet >= 80,
      "quiet": quiet, "receipt": "Ivory: " + coordinate(action.source) + " → " + coordinate(action.target) + (chosen.jump ? " · captured a piece" : "") + (promoted ? " · crowned king" : "") + (continuing ? " · continue jumping" : "")}

  narratron_concede:
    actor: narratron
    description: Concede as Ivory on Narratron's turn, awarding Red the win and the victory crown.
    available: state.turn == -1 && state.winner == 0 && !state.draw
    parameters:
      type: object
      additionalProperties: false
    guard: state.turn == -1 && state.winner == 0 && !state.draw
    result: |-
      {"board": initial.board, "turn": state.turn, "forced": -1, "selected": -1,
      "winner": 1, "draw": false, "quiet": state.quiet,
      "receipt": "Ivory concedes · Red wins"}
    canvas_effects: |-
      canvas.page != null ? [{
        "op": "put_stamp", "target": {"page_id": canvas.page.id},
        "key": "checkers-victory-crown", "asset_id": "stamp:crown",
        "center": {"x": 8500, "y": 1800}, "width": 1600,
        "rotation": 0, "draggable": true
      }] : []

# Passive HTML layout lives in panel.html; all bindings and actions remain CEL.
# See site_docs/game_html_panels.md. Only the 32 playable squares need named actions.
panel:
  parameters:
    status: |-
      state.winner != 0 ? sideName(state.winner) + " wins" : state.draw ? "Draw — quiet-turn limit reached" : sideName(state.turn) + " to move" + (state.forced >= 0 ? " · continue the jump" : "")
    receipt: state.receipt
    cells: |-
      constants.indices.map(cell, {
        "label": coordinate(cell) + (state.board[cell] == 0 ? " empty" : " " + sideName(state.board[cell] > 0 ? 1 : -1) + (state.board[cell] == 2 || state.board[cell] == -2 ? " king" : " piece")) + (cell == state.selected ? " selected" : ""),
        "disabled": !(cell in sources || cell in targets),
        "unselected": cell != state.selected,
        "not_target": !(cell in targets),
        "not_red": state.board[cell] <= 0,
        "not_ivory": state.board[cell] >= 0,
        "symbol": state.board[cell] == 2 || state.board[cell] == -2 ? "♛" : ""
      })
  actions:
    request_narratron_action:
      permission: contributor
      name: '"request_narratron_action"'
    reset:
      name: '"reset"'
      confirmation: Start a new game? This replaces the current position.
