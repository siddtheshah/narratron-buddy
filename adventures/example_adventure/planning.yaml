# Deep Planner Schema: planning.yaml
# All field descriptions, initial values, and sticky values are strictly strings. No arrays, numbers, or complex JSON Schema objects.

"Player Character":
  owner: recorder
  description: "Established player identity, objective, and physical condition."
  fields:
    name:
      description: "Character name"
      initial: "Curious Wanderer"
    goal:
      description: "Current objective in the Library"
      initial: "Explore the discarded story ideas"
    status:
      description: "Physical and mental status"
      initial: "Intrigued"

"Library Exploration":
  owner: recorder
  description: "Current wing and anomalous narrative phenomenon observed."
  fields:
    chamber:
      description: "Current location in the Library"
      initial: "The Hall of Discarded Drafts"
    discovery:
      description: "Key abandoned concept or anomaly nearby"
      initial: "Whispering inkwells and drifting blank manuscripts"

"Discarded Notes & Echoes":
  owner: recorder
  description: "Fragments of forgotten plots, erased characters, and incomplete endings found by the player."
  initial: "Found: A compass with a missing protagonist's name; fragments of an unwritten finale."

"Upcoming Encounter Suggestion":
  owner: planner
  hidden: true
  description: "Upcoming narrative dilemma, forgotten concept, or character echo prepared by the story planner."
  fields:
    encounter:
      description: "Upcoming situation, discarded character, or metaphysical anomaly"
      initial: "Echo of a Scrapped Protagonist in the margin shadows"
    story_goal:
      description: "Underlying narrative objective or creative choice for the player"
      initial: "Uncover why this character was abandoned before their final chapter"
    drama:
      description: "Dramatic stakes, emotional resonance, or lingering question"
      initial: "The forgotten protagonist fears being read again, fearing it will erase their hard-won peace"

